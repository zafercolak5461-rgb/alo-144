<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALO-144 Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<!--
  ALO-144 PANEL (tek çatı)
  - Sol menüde her program bir ana başlık. Ana başlığa basınca program sağda iframe ile açılır.
  - Alt başlıkları program KENDİSİ bildirir (kendi yetki kontrolünden sonra görünen menü öğeleri),
    panel yalnız gösterir. Programlardaki "PANEL KÖPRÜSÜ" bloğu bunu yapar.
  - Açılışta hiçbir program yüklenmez. Bir program bir kez açılınca, başka programa geçildiğinde
    kapanmaz, arkada bekler (tekrar girişe gerek kalmaz).
  - Giriş: Google girişini panel yapar, okuma iznini içerideki programlara iletir.
    Yazma izni ilk kayıtta bir kez istenir; ALO-144 ve Veri Hazırlama aynı izni kullanır.
    Personel Karnesi farklı Google uygulama kimliği kullandığı için (Drive fotoğrafları)
    kayıt/fotoğraf işlemlerinde kendi izin penceresini açar.
  - Giriş/çıkış kaydı (İşlem Günlüğü): yalnız panel yazar ("Panel"). İçerideki programlar
    giriş/çıkış kaydı göndermez; "kaydet" kayıtlarını eskisi gibi gönderir.
  - Google izni ~1 saat geçerlidir; süre dolunca panel "Yenile" düğmesi gösterir ve yeni
    izni açık tüm programlara iletir.
  - Ana başlıklar yetkiye göre: kişinin YETKİLENDİRME'de programın sekmesinde en az bir TRUE'su
    yoksa o başlık görünmez (sekme okunamazsa başlık gösterilir). Alt sayfaları program süzer.
  - Son açılan program ve sayfa tarayıcıda (kişinin e-postasıyla) tutulur; girişten sonra
    oraya dönülür. Sayfaya yetki kalmamışsa programın kendi açılış sayfası açılır.
  - Programlar tek başına açıldığında bu dosyadan etkilenmez.
-->
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{
  --bg:#10182B;
  --panel:#16213D;
  --line:#2A3A5C;
  --text:#FFFFFF;
  --dim:#8FA3C9;
  --dim2:#5D7299;
  --accent:#E8A53D;
}
*{ box-sizing:border-box; }
html, body{ margin:0; height:100%; }
body{ background:var(--bg); color:var(--text); font-family:'Inter', sans-serif; overflow:hidden; }

.cati{ display:flex; height:100vh; }

/* --- Sol menü --- */
#menu{
  width:260px; flex-shrink:0; background:var(--panel); border-right:1px solid var(--line);
  display:flex; flex-direction:column; height:100vh;
}
.cati.kapali #menu{ display:none; }
.menu-bas{
  padding:20px 20px 18px; border-bottom:1px solid var(--line);
  display:flex; align-items:center; gap:10px;
}
.marka{
  width:32px; height:32px; border-radius:8px; background:var(--accent); color:#04140d;
  display:flex; align-items:center; justify-content:center;
  font-family:'Fraunces', serif; font-weight:700; font-size:15px; flex-shrink:0;
}
.marka-ad{ font-family:'Fraunces', serif; font-weight:600; font-size:15px; line-height:1.3; }
.marka-alt{ font-size:10.5px; color:var(--dim); font-family:'IBM Plex Mono', monospace; }
.kucuk-btn{
  background:none; border:1px solid var(--line); border-radius:6px; color:var(--dim);
  width:26px; height:26px; cursor:pointer; font-size:13px; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
}
.kucuk-btn:hover{ color:var(--text); border-color:#3a4d75; }
.menu-bas .kucuk-btn{ margin-left:auto; }

#acBtn{
  display:none; position:fixed; top:12px; left:12px; z-index:50;
  width:34px; height:34px; background:var(--panel); border:1px solid var(--line); border-radius:6px;
  color:var(--text); font-size:15px; cursor:pointer; align-items:center; justify-content:center;
}
.cati.kapali #acBtn{ display:flex; }

#liste{ flex:1; overflow-y:auto; padding:14px 0; }

.ana{
  display:flex; align-items:center; gap:10px; width:100%; text-align:left;
  background:none; border:none; border-left:2px solid transparent;
  color:var(--dim); font-family:'Inter', sans-serif; font-size:14px; font-weight:600;
  padding:11px 18px; cursor:pointer;
}
.ana:hover{ background:rgba(255,255,255,0.03); color:var(--text); }
.ana.acik{ color:var(--accent); border-left-color:var(--accent); background:rgba(232,165,61,0.08); }
.ana .ok{ margin-left:auto; font-size:10px; transition:transform .15s; color:var(--dim2); }
.ana.acik .ok{ transform:rotate(90deg); color:var(--accent); }
.ana .yuklu{ width:6px; height:6px; border-radius:50%; background:transparent; flex-shrink:0; }
.ana.yuklendi .yuklu{ background:var(--dim2); }
.ana.acik .yuklu{ background:var(--accent); }

.alt{ display:none; padding:4px 0 12px; }
.alt.acik{ display:block; }
.alt-grup{
  font-size:10px; text-transform:uppercase; letter-spacing:0.07em; color:var(--dim2);
  padding:10px 20px 4px 38px; font-family:'IBM Plex Mono', monospace;
}
.alt-oge{
  display:block; width:100%; text-align:left; background:none; border:none;
  color:var(--dim); font-family:'Inter', sans-serif; font-size:13px;
  padding:7px 18px 7px 38px; cursor:pointer;
}
.alt-oge:hover{ color:var(--text); background:rgba(255,255,255,0.03); }
.alt-oge.aktif{ color:var(--accent); font-weight:600; }
.alt-oge.pasif{ opacity:.4; cursor:default; }
.alt-not{ font-size:12px; color:var(--dim2); padding:6px 18px 6px 38px; line-height:1.5; }

.menu-alt{
  border-top:1px solid var(--line); padding:12px 20px; display:none; gap:8px;
}
.menu-alt.var{ display:flex; }
.menu-alt button, .menu-alt a{
  flex:1; background:none; border:1px solid var(--line); border-radius:6px;
  color:var(--dim); font-size:11.5px; padding:6px 8px; cursor:pointer; text-align:center;
  text-decoration:none; font-family:'Inter', sans-serif;
}
.menu-alt button:hover, .menu-alt a:hover{ color:var(--text); border-color:#3a4d75; }

/* --- Sağ alan --- */
#sahne{ flex:1; min-width:0; position:relative; background:var(--bg); }
#sahne iframe{ position:absolute; inset:0; width:100%; height:100%; border:0; display:none; background:var(--bg); }
#sahne iframe.acik{ display:block; }
#bos{
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  color:var(--dim2); font-size:13px;
}


/* --- Giriş ekranı --- */
#giris{
  position:fixed; inset:0; z-index:100; background:var(--bg);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px;
}
#giris .ust{ font-family:'IBM Plex Mono', monospace; font-size:12px; letter-spacing:0.15em; color:var(--dim); text-transform:uppercase; margin-bottom:6px; text-align:center; }
#giris h1{ font-family:'Fraunces', serif; font-size:30px; margin:0 0 8px; text-align:center; }
#giris .alt-yazi{ color:var(--dim); font-size:13.5px; text-align:center; }
#girisBtn{
  background:var(--accent); color:#08090b; border:none; font-weight:700; font-size:14px;
  padding:13px 26px; border-radius:10px; cursor:pointer; display:flex; align-items:center; gap:10px;
}
#girisBtn:disabled{ opacity:.6; cursor:wait; }
#girisHata{ color:#e85d5d; font-size:12.5px; max-width:360px; text-align:center; display:none; }
body.girildi #giris{ display:none; }
body:not(.girildi) .cati{ visibility:hidden; }

/* --- Uyarı şeridi (oturum süresi / yazma izni) --- */
#uyari{
  position:fixed; top:12px; left:50%; transform:translateX(-50%); z-index:60;
  background:#2a1f0c; border:1px solid var(--accent); color:var(--text);
  border-radius:10px; padding:10px 14px; font-size:13px;
  display:none; align-items:center; gap:12px; box-shadow:0 8px 30px rgba(0,0,0,.45);
}
#uyari.var{ display:flex; }
#uyari button{
  background:var(--accent); color:#08090b; border:none; border-radius:7px;
  font-weight:700; font-size:12.5px; padding:7px 12px; cursor:pointer;
}
.menu-kisi{ font-size:11px; color:var(--dim2); padding:0 20px 10px; font-family:'IBM Plex Mono', monospace; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

@media (max-width:780px){
  #menu{ position:fixed; z-index:40; left:0; top:0; box-shadow:0 0 30px rgba(0,0,0,.5); }
}
</style>
</head>
<body>
<div id="giris">
  <div>
    <div class="ust">Operasyon Merkezi</div>
    <h1>ALO-144 Panel</h1>
    <div class="alt-yazi">Devam etmek için yetkili Google hesabınızla giriş yapın</div>
  </div>
  <button id="girisBtn">
    <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.7-6.1 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l6-6C34.5 5.1 29.6 3 24 3 12.4 3 3 12.4 3 24s9.4 21 21 21 21-9.4 21-21c0-1.4-.1-2.7-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.1 18.9 12 24 12c3.1 0 5.8 1.1 8 3l6-6C34.5 5.1 29.6 3 24 3c-7.7 0-14.4 4.4-17.7 10.7z"/><path fill="#4CAF50" d="M24 45c5.5 0 10.4-1.9 14.3-5.1l-6.6-5.6C29.6 36 26.9 37 24 37c-5.2 0-9.6-3.3-11.3-8l-6.6 5.1C9.6 40.6 16.3 45 24 45z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.2 4.3-4.1 5.7l6.6 5.6C40.9 36.6 45 30.9 45 24c0-1.4-.1-2.7-.4-3.5z"/></svg>
    Google ile Giriş Yap
  </button>
  <div id="girisHata"></div>
</div>
<div id="uyari"><span id="uyariYazi"></span><button id="uyariBtn"></button></div>
<div class="cati" id="cati">
  <button id="acBtn" title="Menüyü Göster">☰</button>
  <aside id="menu">
    <div class="menu-bas">
      <div class="marka">A</div>
      <div>
        <div class="marka-ad">ALO-144</div>
        <div class="marka-alt">Panel</div>
      </div>
      <button class="kucuk-btn" id="kapatBtn" title="Menüyü Gizle">☰</button>
    </div>
    <div class="menu-kisi" id="kisi"></div>
    <nav id="liste"></nav>
    <div class="menu-alt" id="menuAlt">
      <button id="yenileBtn" title="Açık programı yeniden yükle">↻ Yenile</button>
      <a id="ayriBtn" target="_blank" rel="noopener" title="Açık programı ayrı sekmede aç">↗ Ayrı sekme</a>
    </div>
  </aside>
  <main id="sahne">
    <div id="bos">Soldan bir program seçin</div>
  </main>
</div>

<script>
// Panelde görünecek programlar. "id", programdaki PANEL KÖPRÜSÜ bloğundaki CFG.app ile aynı olmalı.
// Adresler bu dosyanın (alo-144/panel.html) bulunduğu yere göredir.
// yetkiSekme: YETKİLENDİRME tablosunda programın sekmesi. Kişinin o sekmede satırı varsa ve
//   C sütunundan sonra en az bir TRUE'su varsa başlık görünür (sütun eklense de kural aynı kalır).
// sabitYetkili: programın kodunda sabit Süper Yetkili olan hesaplar (tablo boş olsa da görür).
const PROGRAMLAR = [
  { id:'alo144', ad:'ALO-144 Dashboard', url:'ALO-144_DASHBOARD.html',      yetkiSekme:'ALO144',
    sabitYetkili:['zafercolak5461@gmail.com', 'zafer54sema@gmail.com'] },
  { id:'karne',  ad:'Personel Karnesi',  url:'personel-karnesi.html',       yetkiSekme:'PERSONEL KARNESİ',
    sabitYetkili:['zafercolak5461@gmail.com', 'zafer54sema@gmail.com'] },
  { id:'veri',   ad:'Veri Hazırlama',    url:'../veri-hazirlama-projesi/', yetkiSekme:'VERİ HAZIRLAMA',
    sabitYetkili:['zafercolak5461@gmail.com'] },
];
const MESAJ_KAYNAK = 'alo144-panel';

// Google girişi - ALO-144 Dashboard ve Veri Hazırlama ile AYNI uygulama kimliği.
const OAUTH_CLIENT_ID = '334728137950-afbqqtqobh5us03roshseevqh43a4853.apps.googleusercontent.com';
const OKUMA_KAPSAM = 'https://www.googleapis.com/auth/spreadsheets.readonly https://www.googleapis.com/auth/userinfo.email';
const YAZMA_KAPSAM = 'https://www.googleapis.com/auth/spreadsheets';
// YETKİLENDİRME tablosu: giriş kaydındaki isim ve hangi program başlıklarının görüneceği buradan okunur.
// Alt sayfaların yetkisine panel karışmaz; onu her program kendisi uygular.
const AUTH_SHEET_ID = '1PfYdeuiGvuHbHsCx5PTcApepdwdjY-2C491cufssQhU';
const SON_SAYFA_ANAHTAR = 'alo144-panel-son:'; // + e-posta → { program, sayfa } (tarayıcıda, kişiye özel)
const GERI_YUKLE_BEKLEME_MS = 700;  // program menüsü bu süre değişmeden kalınca son sayfa açılır
// Ortak Log – İşlem Günlüğü (programlarla aynı Apps Script).
const LOG_URL = 'https://script.google.com/macros/s/AKfycbzeyn_R-Khl7qAMZozWuq4ZWIy6UAGiqi906MFEnRgl9YNpgQiV-Me2KpF4IJW43WbI/exec';
const SURE_PAYI_MS = 60 * 1000; // izin bitmeden bu kadar önce "süresi doldu" sayılır
const KOPRU_BEKLEME_MS = 4000; // program yüklendikten sonra bu süre içinde menü bildirmezse uyarı gösterilir

// Her programın durumu: iframe, gelen alt menü, yüklenme bilgisi
const durum = {};
PROGRAMLAR.forEach(p => { durum[p.id] = { iframe:null, ogeler:null, yuklendi:false, kopruYok:false, zaman:null }; });
let aktifId = null;

const listeEl = document.getElementById('liste');
const sahneEl = document.getElementById('sahne');
const bosEl = document.getElementById('bos');

function programAdresi(p){ return p.url + (p.url.includes('?') ? '&' : '?') + 'panel=1'; }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// Başlık görünürlüğü: null = henüz okunmadı. Okunamayan sekmenin başlığı gösterilir
// (kimse kilitlenmesin; programın kendi yetki kontrolü yine çalışır).
let gorunur = null;
function gorunenProgramlar(){ return gorunur ? PROGRAMLAR.filter(p => gorunur.has(p.id)) : []; }

function menuCiz(){
  if (!gorunur){
    listeEl.innerHTML = '<div class="alt-not" style="padding-left:20px">Yetkiler okunuyor…</div>';
    return;
  }
  const programlar = gorunenProgramlar();
  if (!programlar.length){
    listeEl.innerHTML = '<div class="alt-not" style="padding-left:20px">Bu hesapla açabileceğiniz program yok. Yöneticinize başvurun.</div>';
    bosEl.textContent = 'Açabileceğiniz program yok';
    return;
  }
  let html = '';
  programlar.forEach(p => {
    const d = durum[p.id];
    const acik = p.id === aktifId;
    html += `<button class="ana${acik ? ' acik' : ''}${d.iframe ? ' yuklendi' : ''}" data-ana="${p.id}">
      <span class="yuklu"></span><span>${esc(p.ad)}</span><span class="ok">▶</span></button>`;
    html += `<div class="alt${acik ? ' acik' : ''}">${acik ? altCiz(p.id) : ''}</div>`;
  });
  listeEl.innerHTML = html;
  const d = aktifId ? durum[aktifId] : null;
  document.getElementById('menuAlt').classList.toggle('var', !!(d && d.iframe));
  if (aktifId){
    const p = PROGRAMLAR.find(x => x.id === aktifId);
    document.getElementById('ayriBtn').href = p.url;
  }
}

function altCiz(id){
  const d = durum[id];
  if (!d.yuklendi) return '<div class="alt-not">Yükleniyor…</div>';
  if (d.kopruYok && !d.ogeler) return '<div class="alt-not">Program menüsünü bildirmedi. Program dosyası güncel olmayabilir (Ctrl+F5 deneyin).</div>';
  if (!d.ogeler) return '<div class="alt-not">Yükleniyor…</div>';
  if (!d.ogeler.length) return '<div class="alt-not">Giriş bekleniyor — sağdan giriş yapın.</div>';
  let html = '', sonGrup = null;
  d.ogeler.forEach(o => {
    if (o.grup && o.grup !== sonGrup) html += `<div class="alt-grup">${esc(o.grup)}</div>`;
    sonGrup = o.grup || null;
    html += `<button class="alt-oge${o.aktif ? ' aktif' : ''}${o.pasif ? ' pasif' : ''}" data-alt="${esc(o.id)}">${esc(o.ad)}</button>`;
  });
  return html;
}

function programAc(id){
  const p = PROGRAMLAR.find(x => x.id === id);
  if (!p || !gorunur || !gorunur.has(id)) return;
  const d = durum[id];
  aktifId = id;
  // Daha önce açılmış programa dönülürse o programın açık sayfası kaydedilir
  const aktifOge = d.ogeler && d.ogeler.find(o => o.aktif);
  sonSayfaKaydet(id, aktifOge ? aktifOge.id : null);
  if (!d.iframe){
    const fr = document.createElement('iframe');
    fr.title = p.ad;
    fr.setAttribute('allow', 'clipboard-read; clipboard-write; fullscreen');
    fr.addEventListener('load', () => {
      d.yuklendi = true;
      d.ogeler = null; d.kopruYok = false;
      gonder(id, { tur:'menu-iste' });
      clearTimeout(d.zaman);
      d.zaman = setTimeout(() => { if (!d.ogeler){ d.kopruYok = true; if (aktifId === id) menuCiz(); } }, KOPRU_BEKLEME_MS);
      if (aktifId === id) menuCiz();
    });
    fr.src = programAdresi(p);
    sahneEl.appendChild(fr);
    d.iframe = fr;
  }
  Object.keys(durum).forEach(k => { if (durum[k].iframe) durum[k].iframe.classList.toggle('acik', k === id); });
  bosEl.style.display = 'none';
  document.title = 'ALO-144 Panel · ' + p.ad;
  menuCiz();
}

function gonder(id, mesaj){
  const d = durum[id];
  if (!d || !d.iframe || !d.iframe.contentWindow) return;
  try { d.iframe.contentWindow.postMessage(Object.assign({ kaynak:MESAJ_KAYNAK }, mesaj), '/'); } catch(e){}
}

// ===== Oturum (giriş izni) =====
const oturum = { token:null, bitis:0, email:'', isim:'' };
const yazma  = { token:null, bitis:0, bekleyenler:[], isteniyor:false };
let okumaClient = null, yazmaClient = null, yenilemeZaman = null, cikisKaydiKuruldu = false;
let yenilemeIstendi = false;

function gisHazir(){ return !!(window.google && google.accounts && google.accounts.oauth2); }
function gisBekle(){
  return new Promise(res => {
    if (gisHazir()) return res();
    const t = setInterval(() => { if (gisHazir()){ clearInterval(t); res(); } }, 100);
  });
}

function girisHatasi(msg){
  const el = document.getElementById('girisHata');
  el.textContent = msg; el.style.display = msg ? 'block' : 'none';
  document.getElementById('girisBtn').disabled = false;
}

function uyariGoster(yazi, dugme, fn){
  document.getElementById('uyariYazi').textContent = yazi;
  const b = document.getElementById('uyariBtn');
  b.textContent = dugme; b.onclick = fn;
  document.getElementById('uyari').classList.add('var');
}
function uyariGizle(){ document.getElementById('uyari').classList.remove('var'); }

function sendLog(tur){
  try {
    const body = JSON.stringify({ isim: oturum.isim || oturum.email || '', type: tur, dashboard: 'Panel' });
    navigator.sendBeacon(LOG_URL, new Blob([body], { type: 'text/plain;charset=UTF-8' }));
  } catch(e){}
}

async function kullaniciBilgisi(){
  try {
    const r = await fetch('https://www.googleapis.com/oauth2/v3/userinfo', { headers:{ Authorization:'Bearer ' + oturum.token } });
    const me = await r.json();
    oturum.email = String(me.email || '').trim().toLocaleLowerCase('tr');
  } catch(e){}
  // Her programın yetki sekmesi ayrı okunur: biri okunamazsa diğerleri etkilenmez.
  const sonuclar = await Promise.all(PROGRAMLAR.map(p => yetkiSekmesiOku(p.yetkiSekme)));
  const yeni = new Set();
  PROGRAMLAR.forEach((p, i) => {
    const satirlar = sonuclar[i];
    if (satirlar === null){ yeni.add(p.id); return; }               // okunamadı → göster
    if (p.sabitYetkili.includes(oturum.email)){ yeni.add(p.id); }
    const satir = satirlar.slice(1).find(x => String(x[1] || '').trim().toLocaleLowerCase('tr') === oturum.email);
    if (!satir) return;
    if (!oturum.isim && satir[0]) oturum.isim = String(satir[0]).trim();
    if (satir.slice(2).some(dogruMu)) yeni.add(p.id);
  });
  gorunur = yeni;
  document.getElementById('kisi').textContent = oturum.isim || oturum.email;
  menuCiz();
}

function dogruMu(v){ return ['TRUE', 'DOĞRU', 'EVET'].includes(String(v == null ? '' : v).trim().toLocaleUpperCase('tr')); }

// Satır listesi döner; okunamazsa null.
async function yetkiSekmesiOku(sekme){
  try {
    const aralik = encodeURIComponent(`'${sekme}'!A1:ZZ1000`);
    const r = await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${AUTH_SHEET_ID}/values/${aralik}`, { headers:{ Authorization:'Bearer ' + oturum.token } });
    const d = await r.json();
    if (!r.ok || d.error) return null;
    return d.values || [];
  } catch(e){ return null; }
}

// ===== Son açılan program ve sayfa (tarayıcıda, kişinin e-postasına bağlı) =====
const geriYukle = { id:null, sayfa:null, zaman:null };   // açılışta beklenen geri yükleme
function sonSayfaOku(){
  try { return JSON.parse(localStorage.getItem(SON_SAYFA_ANAHTAR + oturum.email) || 'null'); } catch(e){ return null; }
}
function sonSayfaKaydet(id, sayfa){
  if (!oturum.email || geriYukle.id === id) return;       // geri yükleme sürerken programın ilk sayfası yazılmasın
  const eski = sonSayfaOku();
  if (!sayfa && eski && eski.program === id) sayfa = eski.sayfa;
  try { localStorage.setItem(SON_SAYFA_ANAHTAR + oturum.email, JSON.stringify({ program:id, sayfa: sayfa || null })); } catch(e){}
}
function sonSayfayiAc(){
  const son = sonSayfaOku();
  if (!son || !son.program || !gorunur.has(son.program)) return;
  geriYukle.id = son.program; geriYukle.sayfa = son.sayfa || null;
  programAc(son.program);
}
// Program menüsünü bildirdikçe çağrılır. Menü kısa süre değişmeden kalınca (programın kendi
// yetki gizlemesi bitince) kayıtlı sayfa açılır; sayfa artık yoksa programın kendi açılışı kalır.
function geriYuklemeyiDene(id){
  if (geriYukle.id !== id) return;
  clearTimeout(geriYukle.zaman);
  geriYukle.zaman = setTimeout(() => {
    const d = durum[id];
    const oge = geriYukle.sayfa && d.ogeler && d.ogeler.find(o => o.id === geriYukle.sayfa && !o.pasif);
    geriYukle.id = null; geriYukle.sayfa = null;
    if (oge && !oge.aktif) gonder(id, { tur:'ac', id: oge.id });   // sonraki menü bildirimi kaydeder
    else sonSayfaKaydet(id, ((d.ogeler || []).find(o => o.aktif) || {}).id);
  }, GERI_YUKLE_BEKLEME_MS);
}

function okumaIzniGeldi(resp){
  if (resp.error){
    if (yenilemeIstendi){ yenilemeIstendi = false; uyariGoster('Oturum yenilenemedi.', 'Tekrar dene', oturumYenile); }
    else girisHatasi('Giriş başarısız oldu: ' + resp.error + '. Erişim izniniz olmayabilir, yöneticinizle iletişime geçin.');
    return;
  }
  const ilkGiris = !oturum.token;
  oturum.token = resp.access_token;
  oturum.bitis = Date.now() + (Number(resp.expires_in) || 3600) * 1000 - SURE_PAYI_MS;
  yenilemeIstendi = false;
  uyariGizle();
  zamanlayiciKur();
  // Açık programlara yeni izni ilet
  Object.keys(durum).forEach(id => { if (durum[id].iframe) gonder(id, { tur:'oturum', token: oturum.token }); });
  if (ilkGiris){
    document.body.classList.add('girildi');
    kullaniciBilgisi().then(() => {
      sonSayfayiAc();
      sendLog('giris');
      if (!cikisKaydiKuruldu){
        cikisKaydiKuruldu = true;
        window.addEventListener('pagehide', () => sendLog('cikis'));
      }
    });
  }
}

function zamanlayiciKur(){
  clearTimeout(yenilemeZaman);
  const kalan = Math.max(0, oturum.bitis - Date.now());
  yenilemeZaman = setTimeout(() => {
    uyariGoster('Oturum süresi doldu. Verilerin okunabilmesi için yenileyin.', '↻ Oturumu yenile', oturumYenile);
  }, kalan);
}

function oturumYenile(){
  if (!okumaClient) return;
  yenilemeIstendi = true;
  okumaClient.requestAccessToken({ prompt: '' });
}

async function girisKur(){
  await gisBekle();
  okumaClient = google.accounts.oauth2.initTokenClient({
    client_id: OAUTH_CLIENT_ID,
    scope: OKUMA_KAPSAM,
    callback: okumaIzniGeldi,
    error_callback: () => {
      if (yenilemeIstendi){ yenilemeIstendi = false; uyariGoster('Oturum yenilenemedi.', 'Tekrar dene', oturumYenile); }
      else girisHatasi('Giriş penceresi açılamadı ya da iptal edildi. Tekrar deneyin.');
    }
  });
  yazmaClient = google.accounts.oauth2.initTokenClient({
    client_id: OAUTH_CLIENT_ID,
    scope: YAZMA_KAPSAM,
    callback: (resp) => {
      yazma.isteniyor = false;
      if (resp.error){ yazmaBitir(null, resp.error); return; }
      yazma.token = resp.access_token;
      yazma.bitis = Date.now() + (Number(resp.expires_in) || 3600) * 1000 - SURE_PAYI_MS;
      uyariGizle();
      yazmaBitir(yazma.token);
    },
    error_callback: (err) => {
      yazma.isteniyor = false;
      // Tarayıcı açılır pencereyi engellediyse kullanıcıdan panelde bir tıklama istenir.
      if (err && err.type === 'popup_failed_to_open'){
        uyariGoster('Kaydetmek için yazma izni gerekiyor.', 'İzin ver', yazmaIste);
        return;
      }
      uyariGizle();
      yazmaBitir(null, 'Yazma izni verilmedi.');
    }
  });
}

document.getElementById('girisBtn').addEventListener('click', () => {
  girisHatasi('');
  if (!okumaClient){ girisHatasi('Google giriş servisi henüz yüklenmedi, birkaç saniye sonra tekrar deneyin.'); return; }
  document.getElementById('girisBtn').disabled = true;
  okumaClient.requestAccessToken({ prompt: 'consent' });
});

// ===== Yazma izni (ilk kayıtta istenir, sonra ALO-144 ve Veri Hazırlama ortak kullanır) =====
function yazmaGecerli(){ return yazma.token && Date.now() < yazma.bitis; }
function yazmaIste(){
  if (!yazmaClient || yazma.isteniyor) return;
  yazma.isteniyor = true;
  yazmaClient.requestAccessToken({ prompt: '' });
}
function yazmaBitir(token, hata){
  const liste = yazma.bekleyenler.splice(0);
  liste.forEach(b => gonder(b.id, { tur:'yazma', no: b.no, token: token || null, hata: token ? null : (hata || 'Yazma izni alınamadı.') }));
}

// ===== Programlardan gelen mesajlar =====
window.addEventListener('message', e => {
  if (e.origin !== location.origin) return;
  const m = e.data || {};
  if (m.kaynak !== MESAJ_KAYNAK) return;
  const id = Object.keys(durum).find(k => durum[k].iframe && durum[k].iframe.contentWindow === e.source);
  if (!id) return;
  const d = durum[id];

  if (m.tur === 'menu'){
    d.ogeler = Array.isArray(m.ogeler) ? m.ogeler : [];
    d.yuklendi = true;
    clearTimeout(d.zaman);
    if (d.ogeler.length){
      if (geriYukle.id === id) geriYuklemeyiDene(id);
      else if (aktifId === id){ const a = d.ogeler.find(o => o.aktif); if (a) sonSayfaKaydet(id, a.id); }
    }
    if (aktifId === id) menuCiz();
  } else if (m.tur === 'oturum-iste'){
    if (oturum.token) gonder(id, { tur:'oturum', token: oturum.token });
  } else if (m.tur === 'yazma-iste'){
    if (yazmaGecerli()){ gonder(id, { tur:'yazma', no: m.no, token: yazma.token }); return; }
    yazma.bekleyenler.push({ id, no: m.no });
    yazmaIste();
  }
});

listeEl.addEventListener('click', e => {
  const ana = e.target.closest('[data-ana]');
  if (ana){ programAc(ana.dataset.ana); return; }
  const alt = e.target.closest('[data-alt]');
  if (alt && aktifId && !alt.classList.contains('pasif')){
    if (geriYukle.id === aktifId){ clearTimeout(geriYukle.zaman); geriYukle.id = null; geriYukle.sayfa = null; }  // kullanıcının seçimi öncelikli
    gonder(aktifId, { tur:'ac', id: alt.dataset.alt });
    sonSayfaKaydet(aktifId, alt.dataset.alt);
    if (window.innerWidth <= 780) document.getElementById('cati').classList.add('kapali');
  }
});

document.getElementById('kapatBtn').addEventListener('click', () => document.getElementById('cati').classList.add('kapali'));
document.getElementById('acBtn').addEventListener('click', () => document.getElementById('cati').classList.remove('kapali'));
document.getElementById('yenileBtn').addEventListener('click', () => {
  if (!aktifId) return;
  const d = durum[aktifId];
  if (!d.iframe) return;
  // Yeniden yüklenince aynı sayfaya dönülsün
  const son = sonSayfaOku();
  if (son && son.program === aktifId && son.sayfa){ geriYukle.id = aktifId; geriYukle.sayfa = son.sayfa; }
  d.yuklendi = false; d.ogeler = null; d.kopruYok = false;
  menuCiz();
  try { d.iframe.contentWindow.location.reload(); } catch(e){ d.iframe.src = d.iframe.src; }
});

menuCiz();
girisKur();
</script>
