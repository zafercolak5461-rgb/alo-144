<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Excel Dosyası Hazırlama</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
/* ===== KABUK ===== ALO-144 / Personel Karnesi ailesiyle aynı görsel kimlik (koyu lacivert + altın vurgu) */
:root{
  --shell-bg:#10182B;
  --shell-panel:#16213D;
  --shell-line:#2A3A5C;
  --shell-text:#FFFFFF;
  --shell-text-dim:#8FA3C9;
  --shell-text-dim-2:#5D7299;
  --shell-accent:#E8A53D;
}
*{ box-sizing:border-box; }
html, body{ margin:0; padding:0; }
body{ background:var(--shell-bg); color:var(--shell-text); font-family:'Inter', sans-serif; }

.shell{ display:flex; min-height:100vh; }

.sidebar{
  width:260px; flex-shrink:0; background:var(--shell-panel); border-right:1px solid var(--shell-line);
  min-height:100vh; padding:20px 0; position:sticky; top:0; align-self:flex-start; max-height:100vh; overflow-y:auto;
}
.sidebar-header{
  padding:0 20px 20px; border-bottom:1px solid var(--shell-line); margin-bottom:16px;
  display:flex; align-items:center; gap:10px;
}
.brand-mark{
  width:32px; height:32px; border-radius:8px; background:var(--shell-accent);
  display:flex; align-items:center; justify-content:center;
  font-family:'Fraunces', serif; font-weight:700; font-size:15px; color:#08090b; flex-shrink:0;
}
.brand-text{ font-family:'Fraunces', serif; font-weight:600; font-size:15px; color:var(--shell-text); line-height:1.3; }
.brand-sub{ font-size:10.5px; color:var(--shell-text-dim); font-family:'IBM Plex Mono', monospace; }

.nav-group{ margin-bottom:22px; }
.nav-group-title{
  font-size:10.5px; text-transform:uppercase; letter-spacing:0.07em; color:var(--shell-text-dim-2);
  padding:0 20px; margin-bottom:8px; font-family:'IBM Plex Mono', monospace;
}
.nav-item{
  display:flex; align-items:center; gap:9px; width:100%; text-align:left; padding:9px 20px;
  background:none; border:none; color:var(--shell-text-dim); font-family:'Inter', sans-serif; font-size:13.5px;
  cursor:pointer; border-left:2px solid transparent; transition:all .12s;
}
.nav-item:hover{ background:rgba(255,255,255,0.03); color:var(--shell-text); }
.nav-item.active{ background:rgba(232,165,61,0.08); color:var(--shell-accent); border-left-color:var(--shell-accent); }

.main{ flex:1; min-width:0; padding:32px 36px; }
.page-title{ font-family:'Fraunces', serif; font-weight:600; font-size:22px; margin:0 0 4px; }
.page-sub{ color:var(--shell-text-dim); font-size:13px; margin:0 0 28px; }

.card{
  background:var(--shell-panel); border:1px solid var(--shell-line); border-radius:12px;
  padding:18px 20px; margin-bottom:14px;
}
.kaynak-card-head{ display:flex; align-items:center; justify-content:space-between; gap:12px; }
.kaynak-ad{ font-weight:600; font-size:14.5px; }
.kaynak-id{ font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--shell-text-dim-2); margin-top:4px; word-break:break-all; }
.kaynak-tabs{ display:flex; flex-wrap:wrap; gap:6px; margin-top:12px; }
.tab-chip{
  background:rgba(232,165,61,0.1); color:var(--shell-accent); border:1px solid rgba(232,165,61,0.25);
  border-radius:999px; padding:4px 11px; font-size:12px; font-family:'IBM Plex Mono', monospace;
}
.refresh-btn{
  background:none; border:1px solid var(--shell-line); color:var(--shell-text-dim); border-radius:8px;
  padding:7px 13px; font-size:12.5px; cursor:pointer; font-family:'Inter', sans-serif; white-space:nowrap;
}
.refresh-btn:hover{ color:var(--shell-text); border-color:var(--shell-accent); }
.hint{ color:var(--shell-text-dim); font-size:12px; }
.empty-state{
  color:var(--shell-text-dim); font-size:13px; border:1px dashed var(--shell-line); border-radius:10px;
  padding:22px; text-align:center;
}
.status-banner{ font-size:12.5px; padding:9px 14px; border-radius:8px; margin-bottom:16px; display:none; }
.status-banner.error{ display:block; background:rgba(232,93,93,0.1); color:#e85d5d; border:1px solid rgba(232,93,93,0.25); }
</style>
</head>
<body>

<div id="loginScreen" style="position:fixed; inset:0; background:var(--shell-bg); display:flex; align-items:center; justify-content:center; z-index:999; flex-direction:column; gap:22px;">
  <div style="text-align:center;">
    <div style="font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:0.15em; color:var(--shell-text-dim); text-transform:uppercase; margin-bottom:6px;">ALO-144 Osmaniye</div>
    <h1 style="font-family:'Fraunces',serif; font-size:30px; font-weight:700; color:var(--shell-text); margin:0 0 8px;">Excel Dosyası Hazırlama</h1>
    <div style="color:var(--shell-text-dim); font-size:13.5px;">Devam etmek için yetkili Google hesabınızla giriş yapın</div>
  </div>
  <button id="googleSignInBtn" style="background:var(--shell-accent); color:#08090b; border:none; font-weight:700; font-size:14px; padding:13px 26px; border-radius:10px; cursor:pointer; display:flex; align-items:center; gap:10px;">
    <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.7-6.1 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l6-6C34.5 5.1 29.6 3 24 3 12.4 3 3 12.4 3 24s9.4 21 21 21 21-9.4 21-21c0-1.4-.1-2.7-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.1 18.9 12 24 12c3.1 0 5.8 1.1 8 3l6-6C34.5 5.1 29.6 3 24 3c-7.7 0-14.4 4.4-17.7 10.7z"/><path fill="#4CAF50" d="M24 45c5.5 0 10.4-1.9 14.3-5.1l-6.6-5.6C29.6 36 26.9 37 24 37c-5.2 0-9.6-3.3-11.3-8l-6.6 5.1C9.6 40.6 16.3 45 24 45z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.2 4.3-4.1 5.7l6.6 5.6C40.9 36.6 45 30.9 45 24c0-1.4-.1-2.7-.4-3.5z"/></svg>
    Google ile Giriş Yap
  </button>
  <div id="loginError" style="color:#e85d5d; font-size:12.5px; display:none; max-width:340px; text-align:center;"></div>
</div>

<div class="shell" id="appShell" style="display:none;">
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="brand-mark">E</div>
      <div>
        <div class="brand-text">Excel Dosyası Hazırlama</div>
        <div class="brand-sub">ALO-144 Osmaniye</div>
      </div>
    </div>
    <div class="nav-group">
      <div class="nav-group-title">Sistem</div>
      <button class="nav-item active" data-page="kaynaklar">Kaynaklar</button>
    </div>
  </aside>

  <main class="main">
    <div id="page-kaynaklar">
      <h1 class="page-title">Kaynaklar</h1>
      <p class="page-sub">Rapor oluştururken kullanılabilecek Google Sheets kaynakları — CONFIG sheet'teki "<span id="kaynaklarTabNameLabel"></span>" sekmesinden okunur.</p>
      <div id="kaynaklarStatus" class="status-banner error"></div>
      <div id="kaynaklarList"></div>
    </div>
  </main>
</div>

<script>
// ===== Kimlik doğrulama: ALO-144 ile BİREBİR AYNI mekanizma =====
// Aynı OAuth Client ID, aynı AUTH_SHEET_ID, aynı "ALO144" sekmesi. Erişim izni için AYRI bir
// sütun açılmadı - kullanıcı kararıyla ALO-144'teki mevcut "Excel" yetkisi (F sütunu) aynen
// kullanılıyor: ALO-144'te Excel yetkisi olan biri burada da otomatik yetkili sayılır.
const OAUTH_CLIENT_ID = "334728137950-afbqqtqobh5us03roshseevqh43a4853.apps.googleusercontent.com";
const OAUTH_SCOPE = "https://www.googleapis.com/auth/spreadsheets.readonly https://www.googleapis.com/auth/userinfo.email";
const AUTH_SHEET_ID = "1PfYdeuiGvuHbHsCx5PTcApepdwdjY-2C491cufssQhU";
const FIXED_SUPER_ADMIN_EMAILS = ["zafercolak5461@gmail.com", "zafer54sema@gmail.com"];
const LOG_URL = "https://script.google.com/macros/s/AKfycbzeyn_R-Khl7qAMZozWuq4ZWIy6UAGiqi906MFEnRgl9YNpgQiV-Me2KpF4IJW43WbI/exec";

// CONFIG sheet - ALO-144'ün CONFIG_SHEET_ID'si DEĞİL, bu proje için ayrı/bağımsız açılan
// "excel dashboard" adlı Google Sheet (Veri Hazırlama Dashboard'un kendi "Kaynaklar"
// sekmesiyle karışmasın diye 18.09.2026'da bilinçli olarak ayrıldı). İçindeki "Kaynaklar"
// sekmesi A sütunu = Görünen Ad (başlık metni önemli değil, sadece konum), B sütunu = Sheet ID.
const CONFIG_SHEET_ID = "1AHTX2Izwt5x-6iy3kSjjhef7mcFnJlnn3u8m-kj3dNE";
const KAYNAKLAR_TAB = "Kaynaklar";

let accessToken = null;
let tokenClient = null;
let userEmail = null;
let userName = null;
let excelAuthorized = false;
let KAYNAKLAR = []; // [{ ad, sheetId }]

document.getElementById('kaynaklarTabNameLabel').textContent = KAYNAKLAR_TAB;

function sendLog(payload){
  try {
    const body = JSON.stringify(Object.assign({ isim: userName }, payload));
    navigator.sendBeacon(LOG_URL, new Blob([body], { type: 'text/plain;charset=UTF-8' }));
  } catch(e){}
}

// Google API'leri ara sıra geçici 503/500/429 hataları döndürebiliyor - authFetch bu durumda
// otomatik olarak (kısa bekleme ile) 2 kez daha dener (ALO-144/Personel Karnesi ile aynı mantık).
async function authFetch(url, token, attempt){
  attempt = attempt || 1;
  const res = await fetch(url, { headers: { 'Authorization': 'Bearer ' + (token || accessToken) } });
  const RETRYABLE_STATUSES = [429, 500, 502, 503, 504];
  if (RETRYABLE_STATUSES.includes(res.status) && attempt < 3){
    await new Promise(r => setTimeout(r, attempt * 700));
    return authFetch(url, token, attempt + 1);
  }
  return res;
}

function isTrueVal(v){ return v === true || String(v || '').trim().toLocaleUpperCase('tr') === 'TRUE'; }

function showLoginError(msg){
  const el = document.getElementById('loginError');
  el.textContent = msg;
  el.style.display = 'block';
}

// ALO144 sekmesi: A=İsim, B=Gmail, C=Süper Yetkili, D=Güncelleme, E=Sunum, F=Excel, G+ = sayfa erişimleri.
// Bu dashboard için sadece F (excel) sütunu okunuyor - PAGE_COLS bu projeye taşınmadı,
// çünkü tek sayfalık bir yetki modeli yeterli (ileride gerekirse eklenir).
async function loadAuthTable(token){
  const url = `https://sheets.googleapis.com/v4/spreadsheets/${AUTH_SHEET_ID}/values/${encodeURIComponent('ALO144!A1:F1000')}`;
  const res = await authFetch(url, token);
  const data = await res.json();
  if (data.error) return null;
  const values = data.values || [];
  if (!values.length) return null;
  const rows = [];
  for (let i = 1; i < values.length; i++){
    const r = values[i] || [];
    const gmail = String(r[1] || '').trim().toLocaleLowerCase('tr');
    if (!gmail) continue;
    rows.push({ gmail, isim: r[0] || '', excel: isTrueVal(r[5]) });
  }
  return rows;
}

async function initAccess(){
  try {
    const meRes = await authFetch('https://www.googleapis.com/oauth2/v3/userinfo');
    const me = await meRes.json();
    userEmail = String(me.email || '').trim().toLocaleLowerCase('tr');
    userName = me.name || userEmail;

    const isFixedAdmin = FIXED_SUPER_ADMIN_EMAILS.includes(userEmail);
    const rows = await loadAuthTable();
    const myRow = (rows || []).find(r => r.gmail === userEmail);
    excelAuthorized = isFixedAdmin || !!(myRow && myRow.excel);

    sendLog({ type: 'giris', dashboard: 'Excel Dosyası Hazırlama' });
    window.addEventListener('pagehide', () => { sendLog({ type: 'cikis', dashboard: 'Excel Dosyası Hazırlama' }); });

    if (!excelAuthorized){
      document.getElementById('appShell').innerHTML = `<div style="padding:60px; text-align:center; color:var(--shell-text-dim); width:100%;">Bu araca erişim yetkiniz yok. ALO-144 Yetki Atama sayfasından "Excel" yetkisi almanız gerekiyor.</div>`;
      return;
    }

    await loadKaynaklar();
    renderKaynaklarList();
  } catch(e){
    document.getElementById('kaynaklarStatus').textContent = 'Yetki kontrolü sırasında hata oluştu: ' + e.message;
    document.getElementById('kaynaklarStatus').style.display = 'block';
  }
}

function initGoogleSignIn(){
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: OAUTH_CLIENT_ID,
    scope: OAUTH_SCOPE,
    callback: (resp) => {
      if (resp.error){
        showLoginError('Giriş başarısız oldu: ' + resp.error + '. Erişim izniniz olmayabilir, yöneticinizle iletişime geçin.');
        return;
      }
      accessToken = resp.access_token;
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('appShell').style.display = '';
      initAccess();
    },
    error_callback: () => {
      showLoginError('Giriş penceresi açılamadı ya da iptal edildi. Tekrar deneyin.');
    }
  });
  document.getElementById('googleSignInBtn').addEventListener('click', () => {
    document.getElementById('loginError').style.display = 'none';
    tokenClient.requestAccessToken({ prompt: 'consent' });
  });
}
window.addEventListener('load', () => {
  if (window.google && google.accounts && google.accounts.oauth2){
    initGoogleSignIn();
  } else {
    setTimeout(initGoogleSignIn, 500);
  }
});

// ===== Kaynaklar sekmesi: CONFIG_SHEET_ID > "Kaynaklar" sekmesi (A=Görünen Ad, B=Sheet ID) =====
async function loadKaynaklar(){
  const statusEl = document.getElementById('kaynaklarStatus');
  statusEl.style.display = 'none';
  try {
    const range = `${KAYNAKLAR_TAB}!A2:B200`;
    const url = `https://sheets.googleapis.com/v4/spreadsheets/${CONFIG_SHEET_ID}/values/${encodeURIComponent(range)}`;
    const res = await authFetch(url);
    const data = await res.json();
    if (data.error){
      statusEl.textContent = `"${KAYNAKLAR_TAB}" sekmesi okunamadı: ${data.error.message || 'bilinmeyen hata'}. CONFIG_SHEET_ID içinde bu sekmenin (A=Görünen Ad, B=Sheet ID) oluşturulduğundan emin olun.`;
      statusEl.style.display = 'block';
      KAYNAKLAR = [];
      return;
    }
    const values = data.values || [];
    KAYNAKLAR = values
      .filter(r => r[0] && r[1])
      .map(r => ({ ad: String(r[0]).trim(), sheetId: String(r[1]).trim() }));
  } catch(e){
    statusEl.textContent = 'Kaynaklar yüklenirken hata oluştu: ' + e.message;
    statusEl.style.display = 'block';
    KAYNAKLAR = [];
  }
}

// Genel amaçlı sekme keşfi - herhangi bir Sheet ID'nin içindeki TÜM sekme başlıklarını döner.
// (ALO-144'teki fetchExistingMonthTabsKarne'nin ay ayrıştırma yapmayan genel hali.)
async function fetchAllTabTitles(sheetId){
  const url = `https://sheets.googleapis.com/v4/spreadsheets/${sheetId}?fields=sheets.properties.title`;
  const res = await authFetch(url);
  const data = await res.json();
  if (data.error) throw new Error(data.error.message || 'Sekme listesi alınamadı.');
  return (data.sheets || []).map(s => s.properties.title);
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}
function cssSafeId(s){ return String(s).replace(/[^a-zA-Z0-9_-]/g, '_'); }

function kaynakCardHtml(k){
  return `
    <div class="card">
      <div class="kaynak-card-head">
        <div>
          <div class="kaynak-ad">${escapeHtml(k.ad)}</div>
          <div class="kaynak-id">${escapeHtml(k.sheetId)}</div>
        </div>
        <button class="refresh-btn kaynak-discover-btn" data-sheetid="${escapeHtml(k.sheetId)}">Sekmeleri Keşfet</button>
      </div>
      <div class="kaynak-tabs" id="tabs-${cssSafeId(k.sheetId)}"></div>
    </div>`;
}

function renderKaynaklarList(){
  const el = document.getElementById('kaynaklarList');
  if (!KAYNAKLAR.length){
    el.innerHTML = `<div class="empty-state">Henüz kaynak tanımlanmamış. CONFIG sheet'te "${escapeHtml(KAYNAKLAR_TAB)}" sekmesine (A=Görünen Ad, B=Sheet ID) satır ekleyin - kod değişikliği gerekmez.</div>`;
    return;
  }
  el.innerHTML = KAYNAKLAR.map(kaynakCardHtml).join('');
}

document.addEventListener('click', async (e) => {
  const btn = e.target.closest('.kaynak-discover-btn');
  if (!btn) return;
  const sheetId = btn.dataset.sheetid;
  const wrap = document.getElementById(`tabs-${cssSafeId(sheetId)}`);
  wrap.innerHTML = `<div class="hint">Yükleniyor...</div>`;
  btn.disabled = true;
  try {
    const titles = await fetchAllTabTitles(sheetId);
    wrap.innerHTML = titles.length
      ? titles.map(t => `<span class="tab-chip">${escapeHtml(t)}</span>`).join('')
      : `<div class="hint">Bu dosyada sekme bulunamadı.</div>`;
  } catch(err){
    wrap.innerHTML = `<div class="hint" style="color:#e85d5d;">${escapeHtml(err.message)}</div>`;
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
