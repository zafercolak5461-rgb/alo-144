<body>

<div class="bar"><div class="bar-in">

<script>
/* ---------- ÇEKİRDEK ---------- */
const RENK = [["185FA5","E6F1FB","0C447C"],["3B6D11","EAF3DE","27500A"],["854F0B","FAEEDA","633806"],["534AB7","EEEDFE","3C3489"],["0F6E56","E1F5EE","085041"],["993556","FBEAF0","72243E"]];
const ORTA = [["B5D4F4","042C53"],["C0DD97","173404"],["FAC775","412402"],["CECBF6","26215C"],["9FE1CB","04342C"],["F4C0D1","4B1528"]];
const GUN = 864e5;
const renk = i => RENK[i % RENK.length];
const pad = n => String(n).padStart(2, '0');
function pzt(d) { const t = new Date(d); t.setHours(12,0,0,0); t.setDate(t.getDate() - ((t.getDay() + 6) % 7)); return t; }
function iso(d) { return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }
function isoTarih(s) { const [y,m,g] = s.split('-').map(Number); return new Date(y, m-1, g, 12); }
function trTarih(d) { return pad(d.getDate()) + '.' + pad(d.getMonth()+1) + '.' + d.getFullYear(); }
function haftaAralik(d) { const m = pzt(d); return trTarih(m) + ' – ' + trTarih(new Date(m.getTime() + 4 * GUN)); }
const VARSAYILAN = { baslik: 'ALO-144 OSMANİYE', anaBaslik: 'Haftalık Mola Planı', ustNot: '', altNot: 'Gruplar her hafta bir üst grubun saatlerine geçer.' };
const metin = (st, k) => (st && st[k] != null ? st[k] : VARSAYILAN[k]);
const satirli = t => esc(t).replace(/\n/g, '<br>');
function haftaFark(a, b) { return Math.round((pzt(a) - pzt(b)) / (7 * GUN)); }
function mod(a, n) { return ((a % n) + n) % n; }
function grupHafta(temel, ofs, N) { return mod(temel - 1 - ofs, N) + 1; }   // her hafta 2→1, 1→N
function grupTemel(buHafta, ofs, N) { return mod(buHafta - 1 + ofs, N) + 1; }
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/** Excel satırlarından (dizi dizisi) planı çözer. Biçim: GRUP | İSİM SOYİSİM | MOLA 1 | ... (grup hücresi birleştirilmiş olabilir) */
function planCoz(aoa) {
  const norm = s => String(s ?? '').trim();
  const ust = s => norm(s).toLocaleUpperCase('tr');
  const isimRe = /İSİM|ISIM|AD SOYAD|ADI SOYADI/;
  const hr = aoa.findIndex(r => (r || []).some(c => isimRe.test(ust(c))));
  if (hr < 0) throw new Error('Başlık satırı bulunamadı. Dosyada "İSİM SOYİSİM" sütunu olmalı.');
  const H = aoa[hr].map(ust);
  const nc = H.findIndex(c => isimRe.test(c));
  let gc = H.findIndex((c, i) => i !== nc && /GRUP/.test(c));
  if (gc < 0) gc = nc - 1;
  if (gc < 0) throw new Error('Grup sütunu bulunamadı. Grup sütunu isim sütununun solunda olmalı.');
  const tc = [], basliklar = [];
  for (let i = nc + 1; i < aoa[hr].length; i++) {
    const b = norm(aoa[hr][i]).replace(/^[^\p{L}\p{N}]+/u, '');
    if (b) { tc.push(i); basliklar.push(b.toLocaleUpperCase('tr')); }
  }
  if (!tc.length) throw new Error('Mola sütunları bulunamadı.');
  let cur = 0; const kisiler = [], slots = {};
  for (let r = hr + 1; r < aoa.length; r++) {
    const row = aoa[r] || [];
    const m = norm(row[gc]).match(/\d+/);
    if (m) cur = +m[0];
    const ad = norm(row[nc]);
    if (!ad || isimRe.test(ust(ad))) continue;                     // boş satır veya tekrar eden başlık
    const saat = tc.map(i => norm(row[i]).replace(/\s*-\s*/, ' - '));
    if (!saat.some(s => /\d{1,2}[:.]\d{2}/.test(s))) continue;     // saati olmayan satır kişi değildir (not, toplam vb.)
    if (!cur) throw new Error(`"${ad}" için grup bulunamadı.`);
    if (!slots[cur] && saat.some(Boolean)) slots[cur] = saat;
    kisiler.push({ ad, g: cur });
  }
  if (!kisiler.length) throw new Error('Personel bulunamadı.');
  const N = Math.max(...kisiler.map(k => k.g));
  const eksik = [];
  for (let g = 1; g <= N; g++) if (!slots[g]) eksik.push(g);
  if (eksik.length) throw new Error(`${eksik.join(', ')}. grubun saatleri yok. Her grupta en az bir kişinin saatleri dolu olmalı.`);
  return { basliklar, saatler: Array.from({ length: N }, (_, i) => slots[i + 1]), kisiler };
}

function haftaPlani(st, monday) {
  const N = st.saatler.length, ofs = haftaFark(monday, isoTarih(st.temelHafta));
  const bol = st.saatler.map((saat, i) => ({ no: i + 1, saat, kisiler: [] }));
  st.kisiler.forEach(k => { if (k.g >= 1 && k.g <= N) bol[grupHafta(k.g, ofs, N) - 1].kisiler.push(k.ad); });
  return { ofs, N, bol, basliklar: st.basliklar, toplam: st.kisiler.length };
}

function ozet(p) {
  const bas = s => (s || '').split(' - ')[0], son = s => (s || '').split(' - ').pop();
  const ilk = p.bol.map(b => bas(b.saat[0])).filter(Boolean).sort()[0] || '—';
  const yi = p.basliklar.findIndex(b => b.includes('YEMEK'));
  let yemek = '—';
  if (yi >= 0) {
    const a = p.bol.map(b => bas(b.saat[yi])).filter(Boolean).sort();
    const z = p.bol.map(b => son(b.saat[yi])).filter(Boolean).sort();
    if (a.length) yemek = a[0] + ' – ' + z[z.length - 1];
  }
  return [['Toplam personel', p.toplam], ['Grup sayısı', p.N], ['İlk mola', ilk], ['Yemek aralığı', yemek]];
}

const ANAHTAR = 'molaPlani.v1', BAG_ANAHTAR = 'molaPlani.baglanti';
let ST = null, goruntu = pzt(new Date()), duzenMod = false, bekleyen = null;
const $ = id => document.getElementById(id);

/* ---------- ORTAK KAYIT (Google Sheets) ---------- */
let BAG = null;                  // { url, key, ad }
let SURUM = null;                // sunucudaki son bilinen sürüm
let META = { guncelleyen: '', guncelleme: '' };
let islemler = [], gonderZ = null, gonderiliyor = false, bekleyenGonderim = false;

function bagOku() { try { BAG = JSON.parse(localStorage.getItem(BAG_ANAHTAR) || 'null'); } catch (e) { BAG = null; } }
function bagYaz() { try { BAG ? localStorage.setItem(BAG_ANAHTAR, JSON.stringify(BAG)) : localStorage.removeItem(BAG_ANAHTAR); } catch (e) {} }
const bagli = () => !!(BAG && BAG.url && BAG.key);

function durumGoster(tur, yazi, ipucu) {
  const d = $('durum'); d.className = 'durum ' + (tur || '');
  d.querySelector('span').textContent = yazi; d.title = ipucu || '';
}
function metaYazi() {
  if (!META.guncelleme) return 'Ortak plan';
  const t = new Date(META.guncelleme);
  const bugun = t.toDateString() === new Date().toDateString();
  return `Son değişiklik: ${META.guncelleyen || '—'}, ${bugun ? '' : trTarih(t) + ' '}${pad(t.getHours())}:${pad(t.getMinutes())}`;
}
function metaAl(r) { if (r.surum != null) SURUM = r.surum; META = { guncelleyen: r.guncelleyen || '', guncelleme: r.guncelleme || '' }; }

async function sunucuGet(op) {
  const u = BAG.url + (BAG.url.includes('?') ? '&' : '?') + 'key=' + encodeURIComponent(BAG.key) + (op ? '&op=' + op : '') + '&t=' + Date.now();
  const res = await fetch(u, { redirect: 'follow' });
  const j = await res.json();
  if (!j.ok) throw new Error(j.error || 'Sunucu hatası');
  return j;
}
async function sunucuPost(govde) {
  const res = await fetch(BAG.url, { method: 'POST', redirect: 'follow', body: JSON.stringify(govde) });
  return res.json();
}

async function sunucudanYukle(sessiz) {
  if (!bagli()) return false;
  durumGoster('is', 'Yükleniyor…');
  try {
    const j = await sunucuGet();
    metaAl(j);
    if (j.state) { ST = j.state; yerelKaydet(); }
    else if (ST && !sessiz && confirm('Ortak kayıt boş. Bu bilgisayardaki planı ortak kayda yükleyelim mi?')) { islem('Plan ilk kez ortak kayda yüklendi'); }
    durumGoster('ok', metaYazi(), 'Ortak kayda bağlı');
    ciz();
    return true;
  } catch (e) {
    durumGoster('hata', 'Bağlantı hatası', e.message);
    if (!sessiz) toast('Ortak kayda ulaşılamadı: ' + e.message);
    return false;
  }
}

/** Bir değişiklik yapıldığında çağrılır: kısa bir beklemeyle tek seferde gönderir. */
function islem(aciklama) {
  if (aciklama) islemler.push(aciklama);
  yerelKaydet();
  if (!bagli()) return;
  durumGoster('is', 'Kaydediliyor…');
  clearTimeout(gonderZ);
  gonderZ = setTimeout(gonder, 700);
}
async function gonder() {
  if (gonderiliyor) { bekleyenGonderim = true; return; }
  if (!ST || !bagli()) return;
  gonderiliyor = true;
  const giden = islemler.splice(0);
  try {
    const j = await sunucuPost({ key: BAG.key, base: SURUM == null ? 0 : SURUM, state: ST, kim: BAG.ad || 'Adsız', islem: giden.join(' · ') || 'Plan güncellendi' });
    if (j.ok) {
      metaAl(j); durumGoster('ok', metaYazi(), 'Ortak kayda bağlı');
    } else if (j.conflict) {
      metaAl(j); if (j.state) ST = j.state; yerelKaydet(); ciz();
      durumGoster('ok', metaYazi());
      toast(`${j.guncelleyen || 'Başka biri'} az önce planı değiştirdi. Güncel hali yüklendi; son değişikliğini tekrar yap.`);
    } else {
      islemler.unshift(...giden);
      durumGoster('hata', 'Kaydedilemedi', j.error);
      toast('Kaydedilemedi: ' + (j.error || 'bilinmeyen hata'));
    }
  } catch (e) {
    islemler.unshift(...giden);
    bekleyenGonderim = true;
    durumGoster('hata', 'Kaydedilemedi, tekrar denenecek', e.message);
  } finally {
    gonderiliyor = false;
    if (bekleyenGonderim) { bekleyenGonderim = false; clearTimeout(gonderZ); gonderZ = setTimeout(gonder, islemler.length ? 700 : 15000); }
  }
}

/** 30 sn'de bir: başkası değiştirdiyse planı yeniler (düzenleme sırasında yazı kutusundaysan bekler). */
async function kontrolEt() {
  if (!bagli() || gonderiliyor || islemler.length || document.hidden) return;
  const odak = document.activeElement;
  if (odak && odak.closest && odak.closest('#duzenle, #yukleme, #baglanti, #ekipDuzen') && /INPUT|TEXTAREA|SELECT/.test(odak.tagName)) return;
  try {
    const j = await sunucuGet('surum');
    if (SURUM == null || j.surum !== SURUM) {
      const once = SURUM;
      await sunucudanYukle(true);
      if (once != null) toast(`${META.guncelleyen || 'Biri'} planı güncelledi.`);
    } else { metaAl(j); durumGoster('ok', metaYazi(), 'Ortak kayda bağlı'); }
  } catch (e) { durumGoster('hata', 'Bağlantı hatası', e.message); }
}
setInterval(kontrolEt, 30000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) kontrolEt(); });

/* Davet linki: ?d=... ile açılınca bağlantıyı kendiliğinden kurar (eski #baglan= linkleri de çalışır) */
const b64u = t => btoa(unescape(encodeURIComponent(t))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const b64uCoz = t => { t = t.replace(/-/g, '+').replace(/_/g, '/'); while (t.length % 4) t += '='; return decodeURIComponent(escape(atob(t))); };
function davetOku() {
  const q = new URLSearchParams(location.search);
  let kod = q.get('d'), eski = false;
  if (!kod) { const m = location.hash.match(/baglan=([^&]+)/); if (m) { kod = decodeURIComponent(m[1]); eski = true; } }
  if (!kod) return;
  try {
    const d = JSON.parse(eski ? decodeURIComponent(escape(atob(kod))) : b64uCoz(kod));
    const url = d.u || d.url, key = d.k || d.key;
    if (url && key) { BAG = { url, key, ad: (BAG && BAG.ad) || '' }; bagYaz(); }
  } catch (e) {}
  history.replaceState(null, '', location.pathname);
}
function davetLinki() {
  const id = (BAG.url.match(/\/macros\/s\/([^/]+)\/exec/) || [])[1];
  const veri = id ? { u: 'https://script.google.com/macros/s/' + id + '/exec', k: BAG.key } : { u: BAG.url, k: BAG.key };
  return location.origin + location.pathname + '?d=' + b64u(JSON.stringify(veri));
}

async function baglantiKaydet() {
  const ad = $('b_ad').value.trim(), url = $('b_url').value.trim(), key = $('b_key').value.trim();
  $('b_hata').textContent = '';
  if (!ad) { $('b_hata').textContent = 'Adını yaz; değişiklik kaydında görünecek.'; return; }

  if (!key) { $('b_hata').textContent = 'Erişim anahtarını yaz.'; return; }

function baglantiKes() {

  BAG = BAG && BAG.ad ? { ad: BAG.ad } : null; bagYaz(); SURUM = null;

async function davetKopyala() {
  const link = davetLinki();

function yukleDurum() { try { const s = localStorage.getItem(ANAHTAR); if (s) ST = JSON.parse(s); } catch (e) { ST = null; } }

function tsvCoz(t) {
  const satirlar = [], s = t.replace(/\r\n?/g, '\n');
  let row = [], hucre = '', tirnak = false;
  for (let i = 0; i < s.length; i++) {
    const c = s[i];
    if (tirnak) { if (c === '"' && s[i + 1] === '"') { hucre += '"'; i++; } else if (c === '"') tirnak = false; else hucre += c; }
    else if (c === '"' && hucre === '') tirnak = true;
    else if (c === '\t') { row.push(hucre); hucre = ''; }
    else if (c === '\n') { row.push(hucre); satirlar.push(row); row = []; hucre = ''; }
    else hucre += c;
  }
  if (hucre || row.length) { row.push(hucre); satirlar.push(row); }
  return satirlar;
}

function excelYaz(p, monday, dosyaAdi) {
  const rows = [['GRUP', 'İSİM SOYİSİM', ...p.basliklar]], merges = [], tur = ['bas'], grupNo = [null];
  p.bol.forEach((b, i) => {
    const s = rows.length;
    b.kisiler.forEach(ad => { rows.push([`${b.no}. GRUP`, ad, ...b.saat]); tur.push('kisi'); grupNo.push(i); });
    if (b.kisiler.length > 1) merges.push({ s: { r: s, c: 0 }, e: { r: s + b.kisiler.length - 1, c: 0 } });
    rows.push(new Array(rows[0].length).fill('')); tur.push('ayir'); grupNo.push(i);
  });
  const ws = XLSX.utils.aoa_to_sheet(rows);
  ws['!merges'] = merges;
  ws['!cols'] = [{ wch: 10 }, { wch: 26 }, ...p.basliklar.map(() => ({ wch: 15 }))];
  ws['!rows'] = tur.map(t => t === 'ayir' ? { hpt: 6 } : { hpt: 18 });
  const kenar = { style: 'thin', color: { rgb: 'C9D3DE' } };
  const border = { top: kenar, bottom: kenar, left: kenar, right: kenar };
  for (let r = 0; r < rows.length; r++) for (let c = 0; c < rows[0].length; c++) {
    const a = XLSX.utils.encode_cell({ r, c });
    if (!ws[a]) ws[a] = { t: 's', v: '' };
    const [d, bg, tx] = grupNo[r] == null ? [] : renk(grupNo[r]);
    const yemek = c >= 2 && p.basliklar[c - 2].includes('YEMEK');
    let s = { font: { name: 'Calibri', sz: 10, color: { rgb: '1D2733' } }, alignment: { horizontal: 'center', vertical: 'center', wrapText: true }, border };
    if (tur[r] === 'bas') s = { ...s, fill: { fgColor: { rgb: '185FA5' } }, font: { ...s.font, bold: true, color: { rgb: 'FFFFFF' } } };
    else if (tur[r] === 'ayir') s = { fill: { fgColor: { rgb: d } } };
    else if (c === 0) s = { ...s, fill: { fgColor: { rgb: bg } }, font: { ...s.font, bold: true, color: { rgb: tx } } };
    else if (c === 1) s = { ...s, font: { ...s.font, bold: true }, alignment: { ...s.alignment, horizontal: 'left' } };
    else if (yemek) s = { ...s, font: { ...s.font, bold: true } };
    ws[a].s = s;
  }
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Mola Planı');
  XLSX.writeFile(wb, dosyaAdi);
}

/* ---------- MOLA KONTROL (CMS karşılaştırma) ----------
   CMS "Anlık İzleme" sayfası Ctrl+A / Ctrl+C ile kopyalanıp yapıştırılır.
   Metin sadece tarayıcıda okunur; vatandaş telefon numaraları atılır, hiçbir yere kaydedilmez. */
let TOLERANS_DK = 2;            // geç çıkma / süre aşımı için tolerans (panelden değişir)
try { const t = +localStorage.getItem('molaPlani.tolerans'); if (t >= 0 && t <= 15 && localStorage.getItem('molaPlani.tolerans') !== null) TOLERANS_DK = t; } catch (e) {}
const ERKEN_DK = 5;             // planlı molaya bu kadar erken çıkış "planlı" sayılır
const DURUM_TUR = s => {
  const t = trKucuk(s);
  if (t === 'yemek') return 'yemek';
  if (t === 'ihtiyaç' || t === 'ihtiyac' || t === 'mola') return 'mola';
  if (t === 'hazır' || t === 'hazir') return 'hazir';
  if (t === 'görüşmede' || t === 'gelen' || t === 'giden') return 'cagri';
  return 'diger';
};
const normAd = s => String(s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLocaleUpperCase('tr').replace(/İ/g, 'I').replace(/[^A-Z ]/g, ' ').replace(/\s+/g, ' ').trim();
const sureSn = t => { const p = t.split(':').map(Number); return p.length === 3 ? p[0] * 3600 + p[1] * 60 + p[2] : p[0] * 60 + p[1]; };
const dk = t => { const m = String(t).match(/(\d{1,2})[:.](\d{2})/); return m ? +m[1] * 60 + +m[2] : null; };
const saatYaz = m => pad(Math.floor(((m % 1440) + 1440) % 1440 / 60)) + ':' + pad(((m % 60) + 60) % 60);
const sureYaz = sn => { const m = Math.floor(sn / 60), s = sn % 60; return m >= 60 ? `${Math.floor(m / 60)} sa ${m % 60} dk` : `${m} dk ${pad(s)} sn`; };

function cmsCoz(metin) {
  const satir = metin.replace(/\r/g, '').split('\n').map(x => x.trim()).filter(Boolean);
  let zaman = null;
  for (const x of satir.slice(0, 40)) {
    const m = x.match(/^(\d{2})[./](\d{2})[./](\d{4})\s+(\d{1,2}):(\d{2})/);
    if (m) { zaman = new Date(+m[3], +m[2] - 1, +m[1], +m[4], +m[5]); break; }
  }
  const BOLUM = { 'gelen çağrı': 'cagri', 'giden çağrı': 'cagri', 'müsait': 'hazir', 'hazır değil': null };
  const BOLUM_ETIKET = { 'gelen çağrı': 'Gelen çağrı', 'giden çağrı': 'Giden çağrı', 'müsait': 'Müsait', 'hazır değil': null };
  let bolumEtiket = null;
  const ajanlar = []; let bolum = null;
  for (let i = 0; i < satir.length; i++) {
    const x = satir[i], k = trKucuk(x);
    if (k in BOLUM) { bolum = BOLUM[k]; bolumEtiket = BOLUM_ETIKET[k]; continue; }
    if (!/^\d{5}$/.test(x) || i === 0) continue;
    const ad = satir[i - 1];
    if (!/^[A-ZÇĞİIÖŞÜ][A-ZÇĞİIÖŞÜ .'-]+$/.test(ad)) continue;
    let durumYazi = null, tur = null, sure = null, telefon = false;
    for (let j = i + 1; j < Math.min(i + 8, satir.length); j++) {
      const y = satir[j];
      if (/^\d{5}$/.test(y)) break;
      if (/^TG:/.test(y)) break;
      if (!durumYazi && /^\+?\d[\d ]{6,}$/.test(y)) { durumYazi = 'Görüşmede'; tur = 'cagri'; telefon = true; continue; }   // telefon numarası: okunmaz, saklanmaz
      if (!durumYazi && /^[A-Za-zÇĞİIÖŞÜçğıiöşü ]+$/.test(y)) { durumYazi = y; tur = DURUM_TUR(y); continue; }
      if (sure == null && /^\d{1,2}:\d{2}(:\d{2})?$/.test(y)) { sure = sureSn(y); continue; }
    }
    if (!durumYazi && bolum) { tur = bolum; durumYazi = bolum === 'cagri' ? 'Görüşmede' : 'Hazır'; }
    // Kutu etiketi: görüşmedeyse bulunduğu bölüm (gelen/giden), hazırsa Müsait, değilse CMS'teki durum yazısı
    let etiket = durumYazi ? (tur === 'hazir' ? 'Müsait' : telefon ? (bolumEtiket && bolum === 'cagri' ? bolumEtiket : 'Görüşmede') : guzelAd(durumYazi)) : (bolumEtiket || 'Diğer');
    ajanlar.push({ ad, no: x, durum: durumYazi || '—', tur: tur || 'diger', sure: sure || 0, etiket });
  }
  return { zaman, ajanlar };
}

/** CMS ajanını plandaki kişiyle eşleştirir: önce kayıtlı numara, sonra tam isim, sonra isim parçaları. */
function eslestir(ajanlar) {
  const kisiler = ST.kisiler.map((k, i) => ({ k, i, n: normAd(k.ad), t: normAd(k.ad).split(' ') }));
  const noIle = new Map(kisiler.filter(x => x.k.cms).map(x => [String(x.k.cms), x]));
  const kullanildi = new Set(), sonuc = [];
  const ata = (a, x, nasil) => { kullanildi.add(x.i); sonuc.push({ a, x, nasil }); };
  const kalan = [];
  ajanlar.forEach(a => { const x = noIle.get(a.no); x && !kullanildi.has(x.i) ? ata(a, x, 'no') : kalan.push(a); });
  const kalan2 = [];
  kalan.forEach(a => {
    const n = normAd(a.ad), adaylar = kisiler.filter(x => !kullanildi.has(x.i) && !x.k.cms && x.n === n);
    adaylar.length === 1 ? ata(a, adaylar[0], 'isim') : kalan2.push(a);
  });
  const dis = (ST.planDisi || []).map(d => ({ ...d, n: normAd(d.ad) }));
  const ekipN = (ekipVar() ? ST.ekip : []).map(e => ({ n: normAd(e.ad), cms: e.cms }));
  const disMi = a => { const n = normAd(a.ad), t = n.split(' ');
    if (ekipN.some(e => (e.cms && e.cms === a.no) || isimBenzer(e.n, n))) return true;
    return dis.some(d => (d.cms && d.cms === a.no) || (d.n && (d.n === n || (d.n.split(' ')[0] === t[0] && t.includes(d.n.split(' ').pop()))))); };
  const planDisiCms = [];
  const eslesmeyen = [];
  kalan2.forEach(a => {
    if (disMi(a)) { planDisiCms.push(a); return; }
    const t = normAd(a.ad).split(' ');
    const n = normAd(a.ad);
    const adaylar = kisiler.filter(x => !kullanildi.has(x.i) && !x.k.cms && isimBenzer(x.n, n));
    adaylar.length === 1 ? ata(a, adaylar[0], 'benzer') : eslesmeyen.push(a);
  });
  return { eslesen: sonuc, eslesmeyen, planDisiCms, cmsteYok: kisiler.filter(x => !kullanildi.has(x.i)) };
}

/** Bir kişinin o günkü planlı molaları: [{bas, bit, tur, ad}] (dakika) */
function kisiDilimleri(k, gun) {
  const N = ST.saatler.length, g = grupHafta(k.g, haftaFark(gun, isoTarih(ST.temelHafta)), N);
  return { g, dilimler: ST.basliklar.map((b, j) => {
    const parca = String(ST.saatler[g - 1][j] || '').split('-');
    const bas = dk(parca[0]), bit = dk(parca[1] || '');
    return bas == null || bit == null ? null : { bas, bit, ad: b, tur: b.includes('YEMEK') ? 'yemek' : 'mola' };
  }).filter(Boolean) };
}

function karsilastir(cms) {
  const ref = cms.zaman || new Date();
  const simdi = ref.getHours() * 60 + ref.getMinutes();
  const es = eslestir(cms.ajanlar);
  const yokGecerli = YOK && YOK.tarih === iso(ref);

      if (a.sure > hak + TOLERANS_DK * 60) asim.push({ ...satir, aciklama: `${d.ad} ${saatYaz(d.bas)}–${saatYaz(d.bit)} · hakkı ${d.bit - d.bas} dk, ${Math.round((a.sure - hak) / 60)} dk fazla` });

  return { ref, yokGecerli, gizlenen, mesaideYok, vardiyaDisi, planSimdi, cmsSimdi, cikmayan, planDisi, asim, dogru, digerDurum, eslesmeyen, planDisiCms, cmsteYok, toplam: cms.ajanlar.length };
}

      <span class="k-not">Molanın başlamasından bu kadar süre sonra çıkmayan ve süresini bu kadar aşan uyarılır.</span></div>
    <div class="k-yok">${YOK
      ? `<span>📋 <b>Yoklama:</b> ${yokSayfaYazi()} · ${YOK.kisiler.length} kişi · <b>${YOK.kisiler.filter(k => k.gelmedi).length}</b> kişi bugün yok <span class="k-not">${YOK.ortak ? `· ortak${YOK.yukleyen ? ', yükleyen ' + esc(YOK.yukleyen) : ''}${YOK.zaman ? ' ' + esc(String(YOK.zaman).slice(-5)) : ''}` : '· sadece bu tarayıcıda'}</span></span><span class="satir"><button onclick="yoklamaDisari()">Dışarı aktar</button><button onclick="$('k_yokDosya').click()">Değiştir</button><button onclick="yoklamaSil()">Kaldır</button></span>`
      : `<span>📋 <b>Bugünün yoklaması yüklü değil.</b> <span class="k-not">${yoklamaSunucuTarih ? `Ortak kayıttaki son yoklama ${trTarih(isoTarih(yoklamaSunucuTarih))} tarihli. ` : ''}Biri yüklediğinde herkes için geçerli olur: rapor/izinli olanlar gizlenir, mesaide olup CMS'te olmayanlar gösterilir.</span></span><span class="satir"><button class="ana" onclick="$('k_yokDosya').click()">Yoklama yükle</button><button onclick="yoklamaYapistirAc()">Tablo yapıştır</button></span>`}
      <input type="file" id="k_yokDosya" accept=".xlsx,.xls" hidden onchange="if(this.files[0])yoklamaDosya(this.files[0]);this.value=''">
    </div>
    <textarea id="k_kutu" rows="2" placeholder="CMS ekranını buraya yapıştır" style="width:100%;margin-top:10px;font:inherit;font-size:13px;padding:8px;border:1px solid var(--br);border-radius:6px"></textarea>`;
  h += gorunumSatiri();
  if (sonCms && kGorunum === 'ekip' && ekipVar() && !EKIP_TASLAK) h += ekipCiz(sonCms);
  else if (sonCms) {
    const s0 = karsilastir(sonCms);
    const s = { ...s0, cikmayan: kSuz(s0.cikmayan), asim: kSuz(s0.asim), planDisi: kSuz(s0.planDisi), dogru: kSuz(s0.dogru) };
    const fb = (v, y) => `<button class="${kFiltre === v ? 'aktif' : ''}" onclick="kFiltre='${v}';kontrolCiz()">${y}</button>`;
    h += `<div class="satir" style="margin-top:10px">${fb('', 'Tümü')}${fb('yemek', 'Sadece yemek')}${fb('mola', 'Sadece mola')}</div>`;
    const ozetSatir = (t, y) => `<span><b>${y}:</b> CMS'te şu an ${s0.cmsSimdi[t]} kişi · planda bu saatte ${s0.planSimdi[t]} kişi</span>`;
    h += `<div class="not" style="margin-top:6px;display:flex;flex-wrap:wrap;gap:4px 18px">${kFiltre !== 'mola' ? ozetSatir('yemek', 'Yemek') : ''}${kFiltre !== 'yemek' ? ozetSatir('mola', 'Mola (İhtiyaç)') : ''}</div>`;
    const gun = s.ref.getDay();
    h += `<div class="not" style="margin-top:8px">CMS saati: <b>${trTarih(s.ref)} ${pad(s.ref.getHours())}:${pad(s.ref.getMinutes())}</b> · CMS'te ${s.toplam} kişi · Planla eşleşen ${s.toplam - s.eslesmeyen.length}</div>`;
    h += durumKutulari(sonCms);
    if (s.yokGecerli) {
      const N = ST.saatler.length, ofs = haftaFark(s.ref, isoTarih(ST.temelHafta));
      const planGrubu = k => { const x = ST.kisiler.find(p => isimBenzer(normAd(p.ad), k.n)); return x ? grupHafta(x.g, ofs, N) + '. grup' : 'planda yok'; };
      const kart = k => `<span class="k-kisi"><b>${esc(gorunurAd(k.ad))}</b><small>${saatYaz(k.vardiya[0])}–${saatYaz(k.vardiya[1])} · ${planGrubu(k)}${k.not ? ' · ' + esc(k.not) : ''}</small></span>`;
      const dusen = s.mesaideYok.filter(k => k.girisVar), gelmemis = s.mesaideYok.filter(k => !k.girisVar);
      if (s.mesaideYok.length) {
        h += `<div class="k-alarm" role="alert">
          <div class="k-alarm-bas"><span class="k-alarm-sayi">${s.mesaideYok.length}</span><div><b>Mesaide ama CMS'te yok</b><div class="k-alarm-alt">Vardiyası şu an devam ediyor, raporlu/izinli değil, ama CMS ekranında görünmüyor.</div></div></div>
          ${dusen.length ? `<div class="k-alarm-grup">Giriş yapmış, CMS'te yok — hattan düşmüş olabilir (${dusen.length})</div><div class="k-alarm-liste">${dusen.map(kart).join('')}</div>` : ''}
          ${gelmemis.length ? `<div class="k-alarm-grup">Vardiyası başladı, yoklamada giriş yok — geç kalmış / habersiz olabilir (${gelmemis.length})</div><div class="k-alarm-liste">${gelmemis.map(kart).join('')}</div>` : ''}
        </div>`;
      } else {
        h += `<div class="k-tamam">✓ Mesaideki herkes CMS'te görünüyor.</div>`;
      }
      if (s.vardiyaDisi.length) {
        const bitti = s.vardiyaDisi.filter(k => k.durum === 'bitti').sort((a, b) => b.vardiya[1] - a.vardiya[1]);
        const baslamadi = s.vardiyaDisi.filter(k => k.durum === 'baslamadi').sort((a, b) => a.vardiya[0] - b.vardiya[0]);
        const bilgi = (k, yazi) => `<span class="k-vd"><b>${esc(gorunurAd(k.ad))}</b> <small>${yazi}</small></span>`;
        h += `<div class="k-vdisi"><div class="k-vdisi-bas">ℹ Vardiya saati nedeniyle hatta olmayanlar (${s.vardiyaDisi.length}) <span class="k-not">— bunlar hata değil</span></div>
          ${bitti.length ? `<div class="k-vdisi-grup">Mesaisi bitti</div><div class="k-vdisi-liste">${bitti.map(k => bilgi(k, saatYaz(k.vardiya[1]) + "'de mesaisi bitti")).join('')}</div>` : ''}
          ${baslamadi.length ? `<div class="k-vdisi-grup">Mesaisi henüz başlamadı</div><div class="k-vdisi-liste">${baslamadi.map(k => bilgi(k, saatYaz(k.vardiya[0]) + "'de başlayacak")).join('')}</div>` : ''}
        </div>`;
      }
      if (s.gizlenen.length) {
        const say = Object.fromEntries(Object.entries(YOK.sayim || {}).filter(([n]) => normAd(n) !== 'BUGUN YOK'));
        h += `<div class="k-not" style="margin-top:6px">Yoklamaya göre bugün gelmeyen ${s.gizlenen.length} kişi kontrollerde gizlendi${Object.keys(say).length ? ': ' + Object.entries(say).sort((a, b) => b[1] - a[1]).map(([n, c]) => `${esc(n)} ${c}`).join(' · ') : ''}</div>`;
      }
    } else if (YOK) h += `<div class="k-not" style="color:#854F0B;margin-top:6px">Yüklü yoklama ${trTarih(isoTarih(YOK.tarih))} tarihli, CMS saati farklı bir gün; yoklama bu kontrolde kullanılmadı.</div>`;
    else h += `<div class="k-not" style="margin-top:6px">Hattan düşenleri görmek için bugünün yoklamasını yükle.</div>`;
    if (ekipVar()) h += `<div class="k-not" style="margin-top:6px">Ekibindeki ${ST.ekip.length} kişi mola planı kontrolüne dahil edilmedi; onları <b>Ekibim</b> görünümünde takip edebilirsin.</div>`;
    if (gun === 0 || gun === 6) h += `<div class="not" style="color:#A32D2D">Hafta sonu: plan hafta içi için hazırlandı, sonuçlar yanıltıcı olabilir.</div>`;
    h += `<div class="k-ozet">
      <div class="k-kutu kirmizi"><b>${s.cikmayan.length}</b><span>Molaya çıkmamış</span></div>
      <div class="k-kutu turuncu"><b>${s.asim.length}</b><span>Süresini aşmış</span></div>
      <div class="k-kutu mor"><b>${s.planDisi.length}</b><span>Planı dışında molada</span></div>
      <div class="k-kutu yesil"><b>${s.dogru.length}</b><span>Planına uygun molada</span></div></div>`;
    const etk = (tur, yazi) => `<span class="etiket ${tur}">${esc(yazi)}</span>`;
    const tablo = (baslik, renk, liste, bosYazi, sureGoster = true) => `<div class="k-bolum"><h4><i style="background:${renk}"></i>${baslik} (${liste.length})</h4>` +
      (liste.length ? `<table class="k-tablo"><tr><th>Personel</th><th>Grup</th><th>CMS durumu</th><th>Plan</th></tr>` +
        liste.sort((a, b) => b.sure - a.sure).map(x => `<tr><td><b>${esc(x.ad)}</b> <span class="k-not">${x.no}</span></td><td class="s">${x.g}. grup</td><td class="s">${etk(x.tur, x.durum)}${sureGoster ? ` <span class="k-not">${sureYaz(x.sure)}</span>` : ''}</td><td class="k-not">${esc(x.aciklama)}</td></tr>`).join('') + `</table>`
        : `<div class="k-not">${bosYazi}</div>`) + `</div>`;
    h += tablo('Molaya çıkmamış', '#E24B4A', s.cikmayan, 'Planda şu an molası olup çıkmayan yok.', false);
    if (s.cikmayan.length) h += `<div class="k-not" style="margin-top:4px">CMS sadece anlık durumu gösterir: bu listedekilerden molasını erken bitirip dönmüş olan da olabilir.</div>`;
    h += tablo('Süresini aşmış', '#EF9F27', s.asim, 'Süre aşımı yok.');
    h += tablo('Planı dışında molada', '#7F77DD', s.planDisi, 'Planı dışında molada olan yok.');
    h += `<details class="k-acik"><summary>Planına uygun molada olanlar (${s.dogru.length})</summary>${tablo('Planına uygun', '#639922', s.dogru, '—')}</details>`;
    if (s.digerDurum.length) h += `<details class="k-acik"><summary>Diğer durumlar (İç Hizmet vb.) (${s.digerDurum.length})</summary>${tablo('Diğer durumlar', '#888780', s.digerDurum, '—')}</details>`;
    if (s.eslesmeyen.length) {
      const secenek = s.cmsteYok.slice().sort((a, b) => a.k.ad.localeCompare(b.k.ad, 'tr')).map(x => `<option value="${x.i}">${esc(x.k.ad)}</option>`).join('');
      h += `<div class="k-bolum"><h4><i style="background:#B4B2A9"></i>CMS'te var, mola listende bulunamadı (${s.eslesmeyen.length})</h4>
        <div class="k-not" style="margin-bottom:6px">Plana hiç eklenmemişse <b>+ Plana ekle</b>'yi seç. Planda farklı yazılmışsa doğru kişiyi seç; eşleşme kaydedilir ve bir dahaki sefere otomatik tanınır. Uzman, sosyal medya gibi plana girmeyecek biriyse <b>Plan dışı</b>'nı seç; bir daha sorulmaz.</div>
        <table class="k-tablo">${s.eslesmeyen.map(a => `<tr><td><b>${esc(a.ad)}</b> <span class="k-not">${a.no}</span></td><td>${etk(a.tur, a.durum)}</td>
          <td><select onchange="cmsBagla('${a.no}', this.value, '${esc(a.ad).replace(/'/g, '')}')"><option value="">Seç…</option><option value="yeni">+ Plana yeni kişi olarak ekle</option><option value="dis">Plan dışı (uzman, sosyal medya vb.) — bir daha sorma</option>${secenek ? `<optgroup label="Plandaki kişiyle eşleştir">${secenek}</optgroup>` : ''}</select></td></tr>`).join('')}</table></div>`;
    }
    const disTum = ST.planDisi || [];
    if (disTum.length) h += `<details class="k-acik"><summary>Plan dışı tutulanlar (${disTum.length}${s.planDisiCms.length ? `, şu an CMS'te ${s.planDisiCms.length}` : ''})</summary>
      <div class="k-not" style="margin:6px 0">Bu kişiler mola kontrolüne girmez. Listeyi Sheet'teki <b>Plan Dışı</b> sayfasından da düzenleyebilirsin.</div>
      <table class="k-tablo">${disTum.map((d, i) => `<tr><td><b>${esc(d.ad)}</b> <span class="k-not">${esc(d.cms || '')}</span></td><td class="k-not">${esc(d.not || '')}</td><td style="text-align:right"><button class="sil" title="Plan dışından çıkar" onclick="disCikar(${i})">×</button></td></tr>`).join('')}</table></details>`;
    if (s.cmsteYok.length) h += `<details class="k-acik"><summary>Planda olup CMS'te görünmeyenler (${s.cmsteYok.length}) — oturum açmamış / izinli olabilir</summary><div class="k-not" style="margin-top:6px;line-height:1.8">${s.cmsteYok.map(x => esc(x.k.ad)).join(' · ')}</div></details>`;
  }
  p.innerHTML = h;
  const k = $('k_kutu');
  k.addEventListener('paste', ev => {
    ev.preventDefault();
    const metin = (ev.clipboardData || window.clipboardData).getData('text/plain');
    const c = cmsCoz(metin);
    if (!c.ajanlar.length) { toast('CMS listesi okunamadı. Anlık İzleme sayfasında Ctrl+A ile tümünü seçip kopyala.'); return; }
    sonCms = c; kontrolCiz();
    yoklamaSunucudan(false).then(() => { if (sonCms === c) kontrolCiz(); });
    toast(`${c.ajanlar.length} kişi okundu`);
  });
  k.addEventListener('input', () => { if (k.value.length > 200) { const c = cmsCoz(k.value); k.value = ''; if (c.ajanlar.length) { sonCms = c; kontrolCiz(); } } });
}
function disCikar(i) {
  const d = (ST.planDisi || [])[i]; if (!d) return;
  if (!confirm(`${d.ad} plan dışı listesinden çıkarılsın mı? Mola kontrolde tekrar sorulur.`)) return;
  ST.planDisi.splice(i, 1); kaydet(`${d.ad} plan dışı listesinden çıkarıldı`); kontrolCiz();
}
const guzelAd = s => { const t = String(s); const tr = /[ÇĞİıÖŞÜçğöşü]/.test(t); return t.split(/\s+/).filter(Boolean).map(w => { const k = tr ? w.toLocaleLowerCase('tr') : w.toLowerCase(); return (tr ? k.charAt(0).toLocaleUpperCase('tr') : k.charAt(0).toUpperCase()) + k.slice(1); }).join(' '); };
/** Ekranda gösterilecek ad: planda varsa plandaki (doğru Türkçe) yazım */
const gorunurAd = ad => { const n = normAd(ad); const x = ST && ST.kisiler.find(k => normAd(k.ad) === n) || ST && ST.kisiler.find(k => isimBenzer(normAd(k.ad), n)); return x ? x.ad : guzelAd(ad); };
function cmsBagla(no, i, cmsAd) {
  if (i === '') return;
  if (i === 'dis') {
    const ad = guzelAd(cmsAd || '');
    const not = (prompt(`${ad} plan dışı tutulacak. Not eklemek ister misin? (örn. Uzman, Sosyal medya)`, '') || '').trim();
    ST.planDisi = (ST.planDisi || []).filter(d => d.cms !== no);
    ST.planDisi.push({ ad, cms: no, not });
    kaydet(`${ad} plan dışı olarak işaretlendi${not ? ' (' + not + ')' : ''}`);
    kontrolCiz(); return;
  }
  if (i === 'yeni') {
    const ad = (prompt('Plana eklenecek ad soyad (Türkçe karakterleri düzeltebilirsin):', guzelAd(cmsAd || '')) || '').trim();
    if (!ad) { kontrolCiz(); return; }
    const ref = (sonCms && sonCms.zaman) || new Date();
    const N = ST.saatler.length;
    const g = parseInt(prompt(`${ad} bu hafta hangi grupta? (1-${N})`, '1'), 10);
    if (!(g >= 1 && g <= N)) { toast('Geçersiz grup'); kontrolCiz(); return; }
    ST.kisiler.forEach(x => { if (String(x.cms) === no) delete x.cms; });
    ST.kisiler.push({ ad, g: grupTemel(g, haftaFark(ref, isoTarih(ST.temelHafta)), N), cms: no });
    kaydet(`${ad} plana eklendi (${g}. grup, CMS ${no})`);
    ciz(); kontrolCiz(); toast(`${ad} plana eklendi`);
    return;
  }
  const k = ST.kisiler[+i];
  ST.kisiler.forEach(x => { if (String(x.cms) === no) delete x.cms; });
  k.cms = no;
  kaydet(`${k.ad} ↔ CMS ${no} eşleştirildi`);
  kontrolCiz();
}
$('kontrolBtn').onclick = () => {
  if (!$('kontrol').hidden) { kontrolKapat(); return; }
  const p = $('kontrol'); p.hidden = false;
  $('kontrolBtn').classList.add('aktif');
  kontrolCiz(); p.scrollIntoView({ behavior: 'smooth' }); setTimeout(() => $('k_kutu') && $('k_kutu').focus(), 50);
  yoklamaSunucudan(true).then(() => { if (!$('kontrol').hidden) { kontrolCiz(); if (!sonCms && $('k_kutu')) $('k_kutu').focus(); } });
};
function kontrolKapat() { sonCms = null; $('kontrol').hidden = true; $('kontrol').innerHTML = ''; $('kontrolBtn').classList.remove('aktif'); window.scrollTo({ top: 0, behavior: 'smooth' }); }
function kontrolTemizle() { sonCms = null; kontrolCiz(); setTimeout(() => $('k_kutu') && $('k_kutu').focus(), 50); }
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('kontrol').hidden && !(document.activeElement && document.activeElement.closest('#duzenle'))) kontrolKapat(); });

/* ---------- KOPYALA / YAZDIR / GEZİNME ---------- */
$('kopyalaBtn').onclick = async () => {
  if (!ST) return;
  const p = haftaPlani(ST, goruntu), html = mailHtml(p, goruntu, ST, '');
  const duz = `${metin(ST, 'anaBaslik')} - ${haftaAralik(goruntu)}\n\n` + p.bol.map(b => `${b.no}. GRUP (${b.saat.join(' | ')})\n` + b.kisiler.join('\n')).join('\n\n');
  try {
    if (navigator.clipboard && window.ClipboardItem) {
      await navigator.clipboard.write([new ClipboardItem({ 'text/html': new Blob([html], { type: 'text/html' }), 'text/plain': new Blob([duz], { type: 'text/plain' }) })]);
      toast('Kopyalandı. Outlook\'ta yeni maile Ctrl+V ile yapıştır.'); return;
    }
  } catch (e) {}
  const d = document.createElement('div');
  d.contentEditable = 'true'; d.style.cssText = 'position:fixed;left:-99999px;top:0';
  d.innerHTML = html; document.body.appendChild(d);
  const r = document.createRange(); r.selectNodeContents(d);
  const s = getSelection(); s.removeAllRanges(); s.addRange(r);
  const ok = document.execCommand('copy'); s.removeAllRanges(); d.remove();
  toast(ok ? 'Kopyalandı. Outlook\'ta yeni maile Ctrl+V ile yapıştır.' : 'Kopyalanamadı. Sayfayı seçip elle kopyala.');
};
$('yazdirBtn').onclick = () => window.print();
$('geri').onclick = () => { goruntu = new Date(goruntu.getTime() - 7 * GUN); ciz(); };
$('ileri').onclick = () => { goruntu = new Date(goruntu.getTime() + 7 * GUN); ciz(); };
$('buHafta').onclick = () => { goruntu = pzt(new Date()); ciz(); };
let seciliGrup = 0;
function grupSec(g) { seciliGrup = seciliGrup === g ? 0 : g; ciz(); }
$('icerik').addEventListener('click', e => { const t = e.target.closest('[data-grup]'); if (t) grupSec(+t.dataset.grup); });
$('icerik').addEventListener('keydown', e => { const t = e.target.closest('.grup-btn'); if (t && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); grupSec(+t.dataset.grup); } });
let araZ; $('ara').oninput = () => { clearTimeout(araZ); araZ = setTimeout(ciz, 200); };

const barH = () => document.documentElement.style.setProperty('--barH', document.querySelector('.bar').offsetHeight + 'px');
barH(); addEventListener('resize', barH);
bagOku(); davetOku(); yukleDurum(); ciz();
if (bagli()) sunucudanYukle(true); else durumGoster('', 'Yerel', 'Ortak kayda bağlı değil — Bağlantı butonundan bağlan');
if (bagli() && !BAG.ad) { $('baglanti').hidden = false; baglantiCiz(); }
</script>
