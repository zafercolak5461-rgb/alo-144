<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mola Planı</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
<style>
  :root { --b:#185FA5; --bd:#0C447C; --bg:#eef2f6; --c:#fff; --t:#1d2733; --m:#6b7785; --br:#d5dde6; --soft:#E6F1FB; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--t); font-family:"Segoe UI",Arial,sans-serif; }
  .bar { position:sticky; top:0; z-index:5; background:var(--c); border-bottom:1px solid var(--br); }
  .bar-in { max-width:1000px; margin:auto; padding:10px 16px; display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .hafta { display:flex; align-items:center; gap:6px; margin-right:auto; }
  .hafta b { min-width:150px; text-align:center; font-size:15px; }
  button { font:inherit; font-size:13px; border:1px solid var(--br); background:var(--c); color:var(--t); padding:7px 12px; border-radius:7px; cursor:pointer; }
  button:hover { background:#f4f6f9; }
  button.ana { background:var(--b); border-color:var(--b); color:#fff; }
  button.ana:hover { background:var(--bd); }
  button.aktif { background:var(--soft); border-color:#85B7EB; color:var(--bd); }
  button.sil { border:0; background:none; color:#A32D2D; font-size:18px; padding:2px 8px; }
  .wrap { max-width:1000px; margin:auto; padding:16px; }
  .kart { background:var(--c); border:1px solid var(--br); border-radius:10px; padding:16px; margin-bottom:14px; }
  .kart h3 { margin:0 0 6px; font-size:16px; }
  .not { color:var(--m); font-size:13px; line-height:1.5; }
  input, select { font:inherit; font-size:13px; padding:6px 8px; border:1px solid var(--br); border-radius:6px; background:#fff; color:var(--t); }
  .satir { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .liste { width:100%; border-collapse:collapse; margin-top:10px; }
  .liste td, .liste th { padding:5px 4px; border-bottom:1px solid #e8edf2; font-size:13px; text-align:left; }
  .liste input { width:100%; }
  .d-filtre { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:10px; position:sticky; top:var(--barH, 58px); background:var(--c); padding:6px 0; z-index:2; }
  .d-filtre input { flex:1; min-width:180px; font-size:14px; padding:8px 10px; }
  .liste tr.tek td { background:#FAEEDA; }
  .d-metin { margin-top:10px; border:1px solid #e1e7ee; border-radius:8px; padding:10px 12px; background:#f8fafc; }
  .d-baslik-liste { margin-top:16px; font-size:14px; font-weight:600; }
  .d-metin summary { cursor:pointer; font-size:14px; font-weight:600; color:var(--t); }
  .metinler { display:grid; grid-template-columns:160px 1fr; gap:8px 10px; align-items:center; margin-top:12px; }
  .metinler textarea { font:inherit; font-size:13px; padding:6px 8px; border:1px solid var(--br); border-radius:6px; resize:vertical; }
  @media (max-width:640px) { .metinler { grid-template-columns:1fr; } }
  .bos { text-align:center; padding:40px 16px; }
  .bos ol { text-align:left; display:inline-block; color:var(--m); font-size:14px; line-height:1.8; margin:12px 0 18px; }
  .mailview { overflow-x:auto; }
  .grup-btn { cursor:pointer; transition:filter .12s; box-shadow:inset 0 -3px 0 rgba(0,0,0,.12); }
  .grup-btn:hover { filter:brightness(.94); }
  .grup-btn:focus-visible { outline:2px solid #185FA5; outline-offset:-2px; }
  .grup-btn.secili { box-shadow:inset 0 0 0 3px #1d2733; }
  .grup-sayi { font-size:10px; font-weight:normal; color:#3d4752; margin-top:2px; }
  .tumu-btn { font-size:12px; padding:3px 10px; margin-left:8px; vertical-align:middle; }
  .durum { font-size:12px; color:var(--m); display:flex; align-items:center; gap:6px; white-space:nowrap; }
  .durum i { width:8px; height:8px; border-radius:50%; background:#B4B2A9; display:inline-block; }
  .durum.ok i { background:#639922; } .durum.is i { background:#EF9F27; } .durum.hata i { background:#E24B4A; }
  .bag-form { display:grid; grid-template-columns:170px 1fr; gap:8px 10px; align-items:center; margin-top:12px; }
  @media (max-width:640px) { .bag-form { grid-template-columns:1fr; } }
  .k-bas { display:flex; justify-content:space-between; align-items:center; gap:8px; position:sticky; top:var(--barH, 58px); z-index:3; background:var(--c); margin:-16px -16px 0; padding:12px 16px; border-bottom:1px solid #e8edf2; border-radius:10px 10px 0 0; }
  .panel { scroll-margin-top:calc(var(--barH, 58px) + 8px); }
  .k-bas h3 { margin:0; }
  .k-yok { display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:8px; margin-top:10px; padding:8px 10px; border:1px dashed #b9c5d2; border-radius:8px; background:#f8fafc; font-size:13px; }
  .k-alarm { margin-top:12px; border:2px solid #E24B4A; background:#FCEBEB; border-radius:10px; padding:14px 16px; }
  .k-alarm-bas { display:flex; align-items:center; gap:14px; }
  .k-alarm-bas b { font-size:17px; color:#791F1F; }
  .k-alarm-sayi { min-width:52px; height:52px; border-radius:50%; background:#E24B4A; color:#fff; font-size:26px; font-weight:700; display:flex; align-items:center; justify-content:center; animation:k-nabiz 1.6s ease-in-out infinite; }
  @keyframes k-nabiz { 0%,100% { box-shadow:0 0 0 0 rgba(226,75,74,.45); } 50% { box-shadow:0 0 0 8px rgba(226,75,74,0); } }
  @media (prefers-reduced-motion: reduce) { .k-alarm-sayi { animation:none; } }
  .k-alarm-alt { font-size:12px; color:#A32D2D; margin-top:2px; }
  .k-alarm-grup { margin-top:12px; font-size:12px; font-weight:700; color:#791F1F; text-transform:uppercase; letter-spacing:.3px; }
  .k-alarm-liste { display:flex; flex-wrap:wrap; gap:8px; margin-top:6px; }
  .k-kisi { display:flex; flex-direction:column; background:#fff; border:1px solid #F09595; border-left:4px solid #E24B4A; border-radius:6px; padding:6px 12px; }
  .k-kisi b { font-size:15px; color:#501313; }
  .k-kisi small { font-size:11px; color:#A32D2D; }
  .k-tamam { margin-top:12px; padding:8px 12px; border-radius:8px; background:#EAF3DE; border:1px solid #97C459; color:#27500A; font-size:13px; font-weight:600; }
  .k-rozet { display:inline-block; margin-left:8px; background:#E24B4A; color:#fff; font-size:12px; font-weight:600; padding:3px 10px; border-radius:12px; vertical-align:middle; }
  .k-mesai { margin-top:10px; padding:10px 12px; border-radius:8px; background:#FCEBEB; border:1px solid #F09595; color:#501313; font-size:13px; line-height:1.6; }
  .k-ozet { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:8px; margin:12px 0; }
  @media (max-width:640px) { .k-ozet { grid-template-columns:repeat(2,minmax(0,1fr)); } }
  .k-kutu { border:1px solid var(--br); border-radius:8px; padding:10px 12px; background:#f8fafc; }
  .k-kutu b { display:block; font-size:22px; }
  .k-kutu span { font-size:12px; color:var(--m); }
  .k-kutu.kirmizi { background:#FCEBEB; border-color:#F09595; } .k-kutu.kirmizi b { color:#A32D2D; }
  .k-kutu.turuncu { background:#FAEEDA; border-color:#EF9F27; } .k-kutu.turuncu b { color:#854F0B; }
  .k-kutu.mor { background:#EEEDFE; border-color:#AFA9EC; } .k-kutu.mor b { color:#3C3489; }
  .k-kutu.yesil { background:#EAF3DE; border-color:#97C459; } .k-kutu.yesil b { color:#27500A; }
  .k-bolum { margin-top:14px; }
  .k-bolum h4 { margin:0 0 6px; font-size:14px; display:flex; align-items:center; gap:8px; }
  .k-bolum h4 i { width:10px; height:10px; border-radius:50%; display:inline-block; }
  .k-tablo { width:100%; border-collapse:collapse; font-size:13px; }
  .k-tablo td, .k-tablo th { padding:6px 6px; border-bottom:1px solid #e8edf2; text-align:left; vertical-align:top; }
  .k-tablo th { font-size:11px; color:var(--m); font-weight:600; text-transform:uppercase; letter-spacing:.3px; }
  .k-tablo .s { white-space:nowrap; font-variant-numeric:tabular-nums; }
  .etiket { display:inline-block; font-size:11px; padding:1px 7px; border-radius:10px; background:#eef2f6; color:#3d4752; white-space:nowrap; }
  .etiket.yemek { background:#FAEEDA; color:#633806; } .etiket.mola { background:#E6F1FB; color:#0C447C; }
  .etiket.cagri { background:#EAF3DE; color:#27500A; } .etiket.hazir { background:#E1F5EE; color:#085041; } .etiket.diger { background:#EEEDFE; color:#3C3489; }
  .k-not { font-size:12px; color:var(--m); }
  details.k-acik summary { cursor:pointer; font-size:13px; color:var(--m); margin-top:12px; }
  #toast { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:#1d2733; color:#fff; padding:10px 16px; border-radius:8px; font-size:14px; display:none; z-index:9; max-width:92%; }
  @media (max-width:640px) { .hafta { margin-right:0; width:100%; justify-content:space-between; } .hafta b { min-width:0; } }
  @media print { .bar, .panel, #toast { display:none !important; } body { background:#fff; } .wrap { padding:0; max-width:none; } }
</style>
</head>
<body>

<div class="bar"><div class="bar-in">
  <div class="hafta">
    <button id="geri" aria-label="Önceki hafta">◀</button>
    <b id="haftaAd">—</b>
    <button id="ileri" aria-label="Sonraki hafta">▶</button>
    <button id="buHafta">Bu hafta</button>
  </div>
  <span id="durum" class="durum" title=""><i></i><span>Yerel</span></span>
  <input id="ara" placeholder="İsim ara" style="width:130px">
  <button id="kontrolBtn">Mola kontrol</button>
  <button id="duzenleBtn">Düzenle</button>
  <button id="yapistirBtn">Yapıştır</button>
  <button id="iceriBtn">İçeri aktar</button>
  <button id="disariBtn">Dışarı aktar</button>
  <button id="yazdirBtn">Yazdır</button>
  <button id="baglantiBtn">Bağlantı</button>
  <button id="kopyalaBtn" class="ana">Mail için kopyala</button>
  <input type="file" id="dosya" accept=".xlsx,.xls" hidden>
</div></div>

<div class="wrap">
  <div id="baglanti" class="kart panel" hidden></div>
  <div id="kontrol" class="kart panel" hidden></div>
  <div id="yukleme" class="kart panel" hidden></div>
  <div id="duzenle" class="kart panel" hidden></div>
  <div id="bilgi" class="not panel" style="margin:0 2px 10px"></div>
  <div id="icerik"></div>
</div>
<div id="toast"></div>

<script>
/* ---------- ÇEKİRDEK ---------- */
const RENK = [["185FA5","E6F1FB","0C447C"],["3B6D11","EAF3DE","27500A"],["854F0B","FAEEDA","633806"],["534AB7","EEEDFE","3C3489"],["0F6E56","E1F5EE","085041"],["993556","FBEAF0","72243E"]];
const ORTA = [["B5D4F4","042C53"],["C0DD97","173404"],["FAC775","412402"],["CECBF6","26215C"],["9FE1CB","04342C"],["F4C0D1","4B1528"]];
const GUN = 864e5;
const renk = i => RENK[i % RENK.length];
const pad = n => String(n).padStart(2, '0');
function pzt(d) { const t = new Date(d); t.setHours(12,0,0,0); t.setDate(t.getDate() - ((t.getDay() + 6) % 7)); return t; }
function iso(d) { return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }
function isoTarih(s) { const [y,m,g] = s.split('-').map(Number); return new Date(y, m-1, g, 12); }
function trTarih(d) { return pad(d.getDate()) + '.' + pad(d.getMonth()+1) + '.' + d.getFullYear(); }
function haftaAralik(d) { const m = pzt(d); return trTarih(m) + ' – ' + trTarih(new Date(m.getTime() + 4 * GUN)); }
const VARSAYILAN = { baslik: 'ALO-144 OSMANİYE', anaBaslik: 'Haftalık Mola Planı', ustNot: '', altNot: 'Gruplar her hafta bir üst grubun saatlerine geçer.' };
const metin = (st, k) => (st && st[k] != null ? st[k] : VARSAYILAN[k]);
const satirli = t => esc(t).replace(/\n/g, '<br>');
function haftaFark(a, b) { return Math.round((pzt(a) - pzt(b)) / (7 * GUN)); }
function mod(a, n) { return ((a % n) + n) % n; }
function grupHafta(temel, ofs, N) { return mod(temel - 1 - ofs, N) + 1; }   // her hafta 2→1, 1→N
function grupTemel(buHafta, ofs, N) { return mod(buHafta - 1 + ofs, N) + 1; }
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/** Excel satırlarından (dizi dizisi) planı çözer. Biçim: GRUP | İSİM SOYİSİM | MOLA 1 | ... (grup hücresi birleştirilmiş olabilir) */
function planCoz(aoa) {
  const norm = s => String(s ?? '').trim();
  const ust = s => norm(s).toLocaleUpperCase('tr');
  const isimRe = /İSİM|ISIM|AD SOYAD|ADI SOYADI/;
  const hr = aoa.findIndex(r => (r || []).some(c => isimRe.test(ust(c))));
  if (hr < 0) throw new Error('Başlık satırı bulunamadı. Dosyada "İSİM SOYİSİM" sütunu olmalı.');
  const H = aoa[hr].map(ust);
  const nc = H.findIndex(c => isimRe.test(c));
  let gc = H.findIndex((c, i) => i !== nc && /GRUP/.test(c));
  if (gc < 0) gc = nc - 1;
  if (gc < 0) throw new Error('Grup sütunu bulunamadı. Grup sütunu isim sütununun solunda olmalı.');
  const tc = [], basliklar = [];
  for (let i = nc + 1; i < aoa[hr].length; i++) {
    const b = norm(aoa[hr][i]).replace(/^[^\p{L}\p{N}]+/u, '');
    if (b) { tc.push(i); basliklar.push(b.toLocaleUpperCase('tr')); }
  }
  if (!tc.length) throw new Error('Mola sütunları bulunamadı.');
  let cur = 0; const kisiler = [], slots = {};
  for (let r = hr + 1; r < aoa.length; r++) {
    const row = aoa[r] || [];
    const m = norm(row[gc]).match(/\d+/);
    if (m) cur = +m[0];
    const ad = norm(row[nc]);
    if (!ad || isimRe.test(ust(ad))) continue;                     // boş satır veya tekrar eden başlık
    const saat = tc.map(i => norm(row[i]).replace(/\s*-\s*/, ' - '));
    if (!saat.some(s => /\d{1,2}[:.]\d{2}/.test(s))) continue;     // saati olmayan satır kişi değildir (not, toplam vb.)
    if (!cur) throw new Error(`"${ad}" için grup bulunamadı.`);
    if (!slots[cur] && saat.some(Boolean)) slots[cur] = saat;
    kisiler.push({ ad, g: cur });
  }
  if (!kisiler.length) throw new Error('Personel bulunamadı.');
  const N = Math.max(...kisiler.map(k => k.g));
  const eksik = [];
  for (let g = 1; g <= N; g++) if (!slots[g]) eksik.push(g);
  if (eksik.length) throw new Error(`${eksik.join(', ')}. grubun saatleri yok. Her grupta en az bir kişinin saatleri dolu olmalı.`);
  return { basliklar, saatler: Array.from({ length: N }, (_, i) => slots[i + 1]), kisiler };
}

function haftaPlani(st, monday) {
  const N = st.saatler.length, ofs = haftaFark(monday, isoTarih(st.temelHafta));
  const bol = st.saatler.map((saat, i) => ({ no: i + 1, saat, kisiler: [] }));
  st.kisiler.forEach(k => { if (k.g >= 1 && k.g <= N) bol[grupHafta(k.g, ofs, N) - 1].kisiler.push(k.ad); });
  return { ofs, N, bol, basliklar: st.basliklar, toplam: st.kisiler.length };
}

function ozet(p) {
  const bas = s => (s || '').split(' - ')[0], son = s => (s || '').split(' - ').pop();
  const ilk = p.bol.map(b => bas(b.saat[0])).filter(Boolean).sort()[0] || '—';
  const yi = p.basliklar.findIndex(b => b.includes('YEMEK'));
  let yemek = '—';
  if (yi >= 0) {
    const a = p.bol.map(b => bas(b.saat[yi])).filter(Boolean).sort();
    const z = p.bol.map(b => son(b.saat[yi])).filter(Boolean).sort();
    if (a.length) yemek = a[0] + ' – ' + z[z.length - 1];
  }
  return [['Toplam personel', p.toplam], ['Grup sayısı', p.N], ['İlk mola', ilk], ['Yemek aralığı', yemek]];
}

/** Mail ile aynı görünüm: tablo tabanlı, satır içi stil (Outlook'a yapıştırınca bozulmaz). */
function mailHtml(p, monday, st, q, ek) {
  const ekran = !!ek, secili = ek && ek.grup || 0;   // ekran: dashboard görünümü (mail kopyasında yok)
  const F = 'font-family:Segoe UI,Arial,sans-serif';
  const qq = (q || '').trim().toLocaleLowerCase('tr');
  const kol = p.basliklar.length + 2;
  let o = `<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#eef2f6"><tr><td align="center" style="padding:0">`;
  o += `<table role="presentation" width="760" cellpadding="0" cellspacing="0" style="max-width:760px;width:100%;background:#ffffff;border:1px solid #d5dde6">`;
  o += `<tr><td style="background:#185FA5;height:6px;line-height:6px;font-size:1px">&nbsp;</td></tr>`;
  o += `<tr><td style="background:#E6F1FB;padding:18px 24px;border-bottom:1px solid #B5D4F4;${F}"><div style="font-size:12px;letter-spacing:.5px;color:#185FA5"><font color="#185FA5"><b>${esc(metin(st, 'baslik'))}</b></font></div><div style="font-size:22px;font-weight:bold;margin-top:2px;color:#042C53"><font color="#042C53"><b>${esc(metin(st, 'anaBaslik'))}</b></font></div><div style="font-size:14px;margin-top:2px;color:#0C447C"><font color="#0C447C">${haftaAralik(monday)}</font></div></td></tr>`;
  if (metin(st, 'ustNot').trim()) o += `<tr><td style="padding:14px 22px 0;${F}"><div style="background:#FAEEDA;border:1px solid #EF9F27;padding:10px 12px;font-size:13px;color:#412402"><font color="#412402">${satirli(metin(st, 'ustNot'))}</font></div></td></tr>`;
  o += `<tr><td style="padding:16px 16px 4px"><table role="presentation" width="100%" cellpadding="0" cellspacing="6"><tr>`;
  ozet(p).forEach(([l, v]) => { o += `<td width="25%" style="background:#f4f6f9;border:1px solid #e1e7ee;padding:10px 12px;${F}"><div style="font-size:11px;color:#6b7785">${l}</div><div style="font-size:20px;font-weight:bold;color:#1d2733;margin-top:2px">${esc(v)}</div></td>`; });
  o += `</tr></table></td></tr>`;
  o += `<tr><td style="padding:12px 22px 4px;${F}"><div style="font-size:15px;font-weight:bold;color:#1d2733">Grup saatleri özeti</div></td></tr>`;
  o += `<tr><td style="padding:6px 22px 12px"><table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="border-collapse:collapse">`;
  const fc = (renk_, t, kalin) => `<font color="#${renk_}">${kalin ? '<b>' + t + '</b>' : t}</font>`;   // Outlook yazı rengini korusun diye
  const th = `background:#D3DDE8;font-size:11px;font-weight:bold;padding:7px 4px;border:1px solid #9fb0c2;text-align:center;${F}`;
  o += `<tr><td style="${th}">${fc('1d2733', 'GRUP', 1)}</td>` + p.basliklar.map(h => `<td style="${th}">${fc('1d2733', esc(h), 1)}</td>`).join('') + `</tr>`;
  p.bol.forEach((b, i) => {
    const [, bg, tx] = renk(i), [orta, koyu] = ORTA[i % ORTA.length];
    const soluk = ekran && secili && secili !== b.no ? 'opacity:.4;' : '';
    const grupHucre = ekran
      ? `<td class="grup-btn${secili === b.no ? ' secili' : ''}" data-grup="${b.no}" role="button" tabindex="0" aria-pressed="${secili === b.no}" title="${secili === b.no ? 'Tüm grupları göster' : 'Sadece ' + b.no + '. grubu göster'}" style="background:#${orta};font-size:12px;padding:6px;border:1px solid #9fb0c2;text-align:center;white-space:nowrap;${soluk}${F}">${fc(koyu, (secili === b.no ? '✓ ' : '') + b.no + '. GRUP', 1)}<div class="grup-sayi">${b.kisiler.length} kişi</div></td>`
      : `<td style="background:#${orta};font-size:12px;padding:6px;border:1px solid #9fb0c2;text-align:center;white-space:nowrap;${F}">${fc(koyu, b.no + '. GRUP', 1)}</td>`;
    o += `<tr>` + grupHucre
      + b.saat.map((t, j) => `<td style="${soluk}background:#${bg};font-size:11px;padding:6px 3px;border:1px solid #9fb0c2;text-align:center;${F}">${fc(tx, esc(t).replace(' - ', '<br>'), p.basliklar[j].includes('YEMEK'))}</td>`).join('') + `</tr>`;
  });
  o += `</table></td></tr>`;

  p.bol.forEach((b, i) => {

const ANAHTAR = 'molaPlani.v1', BAG_ANAHTAR = 'molaPlani.baglanti';
let ST = null, goruntu = pzt(new Date()), duzenMod = false, bekleyen = null;

/* ---------- ORTAK KAYIT (Google Sheets) ---------- */
let BAG = null;                  // { url, key, ad }
let SURUM = null;                // sunucudaki son bilinen sürüm
let META = { guncelleyen: '', guncelleme: '' };
let islemler = [], gonderZ = null, gonderiliyor = false, bekleyenGonderim = false;

function bagOku() { try { BAG = JSON.parse(localStorage.getItem(BAG_ANAHTAR) || 'null'); } catch (e) { BAG = null; } }
function bagYaz() { try { BAG ? localStorage.setItem(BAG_ANAHTAR, JSON.stringify(BAG)) : localStorage.removeItem(BAG_ANAHTAR); } catch (e) {} }
const bagli = () => !!(BAG && BAG.url && BAG.key);

function durumGoster(tur, yazi, ipucu) {
  const d = $('durum'); d.className = 'durum ' + (tur || '');
  d.querySelector('span').textContent = yazi; d.title = ipucu || '';
}
function metaYazi() {
  if (!META.guncelleme) return 'Ortak plan';
  const t = new Date(META.guncelleme);
  const bugun = t.toDateString() === new Date().toDateString();
  return `Son değişiklik: ${META.guncelleyen || '—'}, ${bugun ? '' : trTarih(t) + ' '}${pad(t.getHours())}:${pad(t.getMinutes())}`;
}
function metaAl(r) { if (r.surum != null) SURUM = r.surum; META = { guncelleyen: r.guncelleyen || '', guncelleme: r.guncelleme || '' }; }

async function sunucuGet(op) {
  const u = BAG.url + (BAG.url.includes('?') ? '&' : '?') + 'key=' + encodeURIComponent(BAG.key) + (op ? '&op=' + op : '') + '&t=' + Date.now();
  const res = await fetch(u, { redirect: 'follow' });
  const j = await res.json();
  if (!j.ok) throw new Error(j.error || 'Sunucu hatası');
  return j;
}
async function sunucuPost(govde) {
  const res = await fetch(BAG.url, { method: 'POST', redirect: 'follow', body: JSON.stringify(govde) });
  return res.json();
}

async function sunucudanYukle(sessiz) {
  if (!bagli()) return false;
  durumGoster('is', 'Yükleniyor…');
  try {
    const j = await sunucuGet();
    metaAl(j);
    if (j.state) { ST = j.state; yerelKaydet(); }
    else if (ST && !sessiz && confirm('Ortak kayıt boş. Bu bilgisayardaki planı ortak kayda yükleyelim mi?')) { islem('Plan ilk kez ortak kayda yüklendi'); }
    durumGoster('ok', metaYazi(), 'Ortak kayda bağlı');
    ciz();
    return true;
  } catch (e) {
    durumGoster('hata', 'Bağlantı hatası', e.message);
    if (!sessiz) toast('Ortak kayda ulaşılamadı: ' + e.message);

}

/** Bir değişiklik yapıldığında çağrılır: kısa bir beklemeyle tek seferde gönderir. */
function islem(aciklama) {
  if (aciklama) islemler.push(aciklama);
  yerelKaydet();
  if (!bagli()) return;
  durumGoster('is', 'Kaydediliyor…');
  clearTimeout(gonderZ);
  gonderZ = setTimeout(gonder, 700);
}
async function gonder() {
  if (gonderiliyor) { bekleyenGonderim = true; return; }
  if (!ST || !bagli()) return;
  gonderiliyor = true;
  const giden = islemler.splice(0);
  try {
    const j = await sunucuPost({ key: BAG.key, base: SURUM == null ? 0 : SURUM, state: ST, kim: BAG.ad || 'Adsız', islem: giden.join(' · ') || 'Plan güncellendi' });
    if (j.ok) {
      metaAl(j); durumGoster('ok', metaYazi(), 'Ortak kayda bağlı');
    } else if (j.conflict) {
      metaAl(j); if (j.state) ST = j.state; yerelKaydet(); ciz();
      durumGoster('ok', metaYazi());
      toast(`${j.guncelleyen || 'Başka biri'} az önce planı değiştirdi. Güncel hali yüklendi; son değişikliğini tekrar yap.`);
    } else {
      islemler.unshift(...giden);
      durumGoster('hata', 'Kaydedilemedi', j.error);
      toast('Kaydedilemedi: ' + (j.error || 'bilinmeyen hata'));
    }
  } catch (e) {
    islemler.unshift(...giden);
    bekleyenGonderim = true;
    durumGoster('hata', 'Kaydedilemedi, tekrar denenecek', e.message);
  } finally {
    gonderiliyor = false;
    if (bekleyenGonderim) { bekleyenGonderim = false; clearTimeout(gonderZ); gonderZ = setTimeout(gonder, islemler.length ? 700 : 15000); }
  }
}

/** 30 sn'de bir: başkası değiştirdiyse planı yeniler (düzenleme sırasında yazı kutusundaysan bekler). */

      if (once != null) toast(`${META.guncelleyen || 'Biri'} planı güncelledi.`);

}

/* Davet linki: ?d=... ile açılınca bağlantıyı kendiliğinden kurar (eski #baglan= linkleri de çalışır) */
const b64u = t => btoa(unescape(encodeURIComponent(t))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const b64uCoz = t => { t = t.replace(/-/g, '+').replace(/_/g, '/'); while (t.length % 4) t += '='; return decodeURIComponent(escape(atob(t))); };
function davetOku() {
  const q = new URLSearchParams(location.search);
  let kod = q.get('d'), eski = false;
  if (!kod) { const m = location.hash.match(/baglan=([^&]+)/); if (m) { kod = decodeURIComponent(m[1]); eski = true; } }
  if (!kod) return;
  try {
    const d = JSON.parse(eski ? decodeURIComponent(escape(atob(kod))) : b64uCoz(kod));
    const url = d.u || d.url, key = d.k || d.key;
    if (url && key) { BAG = { url, key, ad: (BAG && BAG.ad) || '' }; bagYaz(); }
  } catch (e) {}
  history.replaceState(null, '', location.pathname);
}
function davetLinki() {
  const id = (BAG.url.match(/\/macros\/s\/([^/]+)\/exec/) || [])[1];
  const veri = id ? { u: 'https://script.google.com/macros/s/' + id + '/exec', k: BAG.key } : { u: BAG.url, k: BAG.key };
  return location.origin + location.pathname + '?d=' + b64u(JSON.stringify(veri));
}

function tsvCoz(t) {
  const satirlar = [], s = t.replace(/\r\n?/g, '\n');
  let row = [], hucre = '', tirnak = false;
  for (let i = 0; i < s.length; i++) {
    const c = s[i];
    if (tirnak) { if (c === '"' && s[i + 1] === '"') { hucre += '"'; i++; } else if (c === '"') tirnak = false; else hucre += c; }
    else if (c === '"' && hucre === '') tirnak = true;
    else if (c === '\t') { row.push(hucre); hucre = ''; }
    else if (c === '\n') { row.push(hucre); satirlar.push(row); row = []; hucre = ''; }
    else hucre += c;
  }
  if (hucre || row.length) { row.push(hucre); satirlar.push(row); }
  return satirlar;
}

  bekleyen = null; kaydet(`Yeni plan yüklendi (${ST.kisiler.length} kişi, ${haftaAralik(mon)} haftası)`); $('yukleme').hidden = true; goruntu = mon; ciz();

/* ---------- DIŞARI AKTAR ---------- */
function excelYaz(p, monday, dosyaAdi) {
  const rows = [['GRUP', 'İSİM SOYİSİM', ...p.basliklar]], merges = [], tur = ['bas'], grupNo = [null];
  p.bol.forEach((b, i) => {
    const s = rows.length;
    b.kisiler.forEach(ad => { rows.push([`${b.no}. GRUP`, ad, ...b.saat]); tur.push('kisi'); grupNo.push(i); });
    if (b.kisiler.length > 1) merges.push({ s: { r: s, c: 0 }, e: { r: s + b.kisiler.length - 1, c: 0 } });
    rows.push(new Array(rows[0].length).fill('')); tur.push('ayir'); grupNo.push(i);
  });
  const ws = XLSX.utils.aoa_to_sheet(rows);
  ws['!merges'] = merges;
  ws['!cols'] = [{ wch: 10 }, { wch: 26 }, ...p.basliklar.map(() => ({ wch: 15 }))];
  ws['!rows'] = tur.map(t => t === 'ayir' ? { hpt: 6 } : { hpt: 18 });
  const kenar = { style: 'thin', color: { rgb: 'C9D3DE' } };
  const border = { top: kenar, bottom: kenar, left: kenar, right: kenar };
  for (let r = 0; r < rows.length; r++) for (let c = 0; c < rows[0].length; c++) {
    const a = XLSX.utils.encode_cell({ r, c });
    if (!ws[a]) ws[a] = { t: 's', v: '' };
    const [d, bg, tx] = grupNo[r] == null ? [] : renk(grupNo[r]);
    const yemek = c >= 2 && p.basliklar[c - 2].includes('YEMEK');
    let s = { font: { name: 'Calibri', sz: 10, color: { rgb: '1D2733' } }, alignment: { horizontal: 'center', vertical: 'center', wrapText: true }, border };

/* ---------- MOLA KONTROL (CMS karşılaştırma) ----------
   CMS "Anlık İzleme" sayfası Ctrl+A / Ctrl+C ile kopyalanıp yapıştırılır.
   Metin sadece tarayıcıda okunur; vatandaş telefon numaraları atılır, hiçbir yere kaydedilmez. */
let TOLERANS_DK = 2;            // geç çıkma / süre aşımı için tolerans (panelden değişir)
try { const t = +localStorage.getItem('molaPlani.tolerans'); if (t >= 0 && t <= 15 && localStorage.getItem('molaPlani.tolerans') !== null) TOLERANS_DK = t; } catch (e) {}
const ERKEN_DK = 5;             // planlı molaya bu kadar erken çıkış "planlı" sayılır
const DURUM_TUR = s => {
  const t = trKucuk(s);
  if (t === 'yemek') return 'yemek';
  if (t === 'ihtiyaç' || t === 'ihtiyac' || t === 'mola') return 'mola';
  if (t === 'hazır' || t === 'hazir') return 'hazir';
  if (t === 'görüşmede' || t === 'gelen' || t === 'giden') return 'cagri';
  return 'diger';
};
const normAd = s => String(s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLocaleUpperCase('tr').replace(/İ/g, 'I').replace(/[^A-Z ]/g, ' ').replace(/\s+/g, ' ').trim();
const sureSn = t => { const p = t.split(':').map(Number); return p.length === 3 ? p[0] * 3600 + p[1] * 60 + p[2] : p[0] * 60 + p[1]; };
const dk = t => { const m = String(t).match(/(\d{1,2})[:.](\d{2})/); return m ? +m[1] * 60 + +m[2] : null; };
const saatYaz = m => pad(Math.floor(((m % 1440) + 1440) % 1440 / 60)) + ':' + pad(((m % 60) + 60) % 60);
const sureYaz = sn => { const m = Math.floor(sn / 60), s = sn % 60; return m >= 60 ? `${Math.floor(m / 60)} sa ${m % 60} dk` : `${m} dk ${pad(s)} sn`; };

function cmsCoz(metin) {
  const satir = metin.replace(/\r/g, '').split('\n').map(x => x.trim()).filter(Boolean);
  let zaman = null;
  for (const x of satir.slice(0, 40)) {
    const m = x.match(/^(\d{2})[./](\d{2})[./](\d{4})\s+(\d{1,2}):(\d{2})/);
    if (m) { zaman = new Date(+m[3], +m[2] - 1, +m[1], +m[4], +m[5]); break; }
  }
  const BOLUM = { 'gelen çağrı': 'cagri', 'giden çağrı': 'cagri', 'müsait': 'hazir', 'hazır değil': null };
  const ajanlar = []; let bolum = null;
  for (let i = 0; i < satir.length; i++) {
    const x = satir[i], k = trKucuk(x);
    if (k in BOLUM) { bolum = BOLUM[k]; continue; }
    if (!/^\d{5}$/.test(x) || i === 0) continue;
    const ad = satir[i - 1];
    if (!/^[A-ZÇĞİIÖŞÜ][A-ZÇĞİIÖŞÜ .'-]+$/.test(ad)) continue;
    let durumYazi = null, tur = null, sure = null;
    for (let j = i + 1; j < Math.min(i + 8, satir.length); j++) {
      const y = satir[j];
      if (/^\d{5}$/.test(y)) break;
      if (/^TG:/.test(y)) break;
      if (!durumYazi && /^\+?\d[\d ]{6,}$/.test(y)) { durumYazi = 'Görüşmede'; tur = 'cagri'; continue; }   // telefon numarası: okunmaz, saklanmaz
      if (!durumYazi && /^[A-Za-zÇĞİIÖŞÜçğıiöşü ]+$/.test(y)) { durumYazi = y; tur = DURUM_TUR(y); continue; }
      if (sure == null && /^\d{1,2}:\d{2}(:\d{2})?$/.test(y)) { sure = sureSn(y); continue; }
    }
    if (!durumYazi && bolum) { tur = bolum; durumYazi = bolum === 'cagri' ? 'Görüşmede' : 'Hazır'; }
    ajanlar.push({ ad, no: x, durum: durumYazi || '—', tur: tur || 'diger', sure: sure || 0 });
  }
  return { zaman, ajanlar };
}

/** CMS ajanını plandaki kişiyle eşleştirir: önce kayıtlı numara, sonra tam isim, sonra isim parçaları. */
function eslestir(ajanlar) {
  const kisiler = ST.kisiler.map((k, i) => ({ k, i, n: normAd(k.ad), t: normAd(k.ad).split(' ') }));
  const noIle = new Map(kisiler.filter(x => x.k.cms).map(x => [String(x.k.cms), x]));
  const kullanildi = new Set(), sonuc = [];
  const ata = (a, x, nasil) => { kullanildi.add(x.i); sonuc.push({ a, x, nasil }); };
  const kalan = [];
  ajanlar.forEach(a => { const x = noIle.get(a.no); x && !kullanildi.has(x.i) ? ata(a, x, 'no') : kalan.push(a); });
  const kalan2 = [];
  kalan.forEach(a => {
    const n = normAd(a.ad), adaylar = kisiler.filter(x => !kullanildi.has(x.i) && !x.k.cms && x.n === n);
    adaylar.length === 1 ? ata(a, adaylar[0], 'isim') : kalan2.push(a);
  });
  const dis = (ST.planDisi || []).map(d => ({ ...d, n: normAd(d.ad) }));
  const disMi = a => { const n = normAd(a.ad), t = n.split(' ');
    return dis.some(d => (d.cms && d.cms === a.no) || (d.n && (d.n === n || (d.n.split(' ')[0] === t[0] && t.includes(d.n.split(' ').pop()))))); };
  const planDisiCms = [];
  const eslesmeyen = [];
  kalan2.forEach(a => {
    if (disMi(a)) { planDisiCms.push(a); return; }
    const t = normAd(a.ad).split(' ');
    const n = normAd(a.ad);
    const adaylar = kisiler.filter(x => !kullanildi.has(x.i) && !x.k.cms && isimBenzer(x.n, n));
    adaylar.length === 1 ? ata(a, adaylar[0], 'benzer') : eslesmeyen.push(a);
  });
  return { eslesen: sonuc, eslesmeyen, planDisiCms, cmsteYok: kisiler.filter(x => !kullanildi.has(x.i)) };
}

/** Bir kişinin o günkü planlı molaları: [{bas, bit, tur, ad}] (dakika) */
function kisiDilimleri(k, gun) {
  const N = ST.saatler.length, g = grupHafta(k.g, haftaFark(gun, isoTarih(ST.temelHafta)), N);
  return { g, dilimler: ST.basliklar.map((b, j) => {
    const parca = String(ST.saatler[g - 1][j] || '').split('-');
    const bas = dk(parca[0]), bit = dk(parca[1] || '');
    return bas == null || bit == null ? null : { bas, bit, ad: b, tur: b.includes('YEMEK') ? 'yemek' : 'mola' };
  }).filter(Boolean) };
}

function karsilastir(cms) {
  const ref = cms.zaman || new Date();
  const simdi = ref.getHours() * 60 + ref.getMinutes();
  const es = eslestir(cms.ajanlar);
  const yokGecerli = YOK && YOK.tarih === iso(ref);
  const gelmediMi = ad => { if (!yokGecerli) return false; const y = yoklamaBul(ad); return !!(y && y.gelmedi); };
  const eslesen = es.eslesen.filter(e => !gelmediMi(e.x.k.ad));
  const eslesmeyen = es.eslesmeyen.filter(a => !gelmediMi(a.ad));
  const planDisiCms = es.planDisiCms;
  const cmsteYok = es.cmsteYok.filter(x => !gelmediMi(x.k.ad));
  const gizlenen = yokGecerli ? YOK.kisiler.filter(k => k.gelmedi) : [];
  let mesaideYok = [];
  if (yokGecerli) {
    const cmsN = cms.ajanlar.map(a => normAd(a.ad));
    const cmsteVar = k => cmsN.some(n => isimBenzer(n, k.n));
    mesaideYok = YOK.kisiler.filter(k => !k.gelmedi && k.vardiya && simdi >= k.vardiya[0] && simdi < k.vardiya[1] && !cmsteVar(k));
    // Son tur: soyadı değişmiş olabilir (evlilik vb.). Adı aynı olan, yoklamada karşılığı olmayan tek bir CMS kaydı varsa aynı kişi say.
    const yoklamadaYok = cmsN.filter(n => !YOK.kisiler.some(k => isimBenzer(n, k.n)));
    mesaideYok = mesaideYok.filter(k => { const ilk = k.n.split(' ')[0]; return yoklamadaYok.filter(n => n.split(' ')[0] === ilk).length !== 1; });
  }
  const cikmayan = [], planDisi = [], asim = [], dogru = [], digerDurum = [];
  const planSimdi = { yemek: 0, mola: 0 }, cmsSimdi = { yemek: 0, mola: 0 };
  cms.ajanlar.forEach(a => { if (a.tur in cmsSimdi) cmsSimdi[a.tur]++; });
  eslesen.forEach(({ a, x }) => {
    const { g, dilimler } = kisiDilimleri(x.k, ref);
    const pl = dilimler.find(d => simdi >= d.bas && simdi < d.bit); if (pl) planSimdi[pl.tur]++;
    const molada = a.tur === 'mola' || a.tur === 'yemek';
    const satir = { ad: x.k.ad, no: a.no, g, durum: a.durum, tur: a.tur, sure: a.sure };
    if (molada) {
      const basladi = simdi - Math.round(a.sure / 60);
      const d = dilimler.find(d => d.tur === a.tur && basladi >= d.bas - ERKEN_DK && basladi <= d.bit);
      if (!d) {
        const sonraki = dilimler.filter(d => d.tur === a.tur && d.bas > simdi).sort((p, q) => p.bas - q.bas)[0];
        const onceki = dilimler.filter(d => d.tur === a.tur && d.bit <= simdi).sort((p, q) => q.bas - p.bas)[0];
        planDisi.push({ ...satir, aciklama: `Çıkış ~${saatYaz(basladi)}` + (onceki ? ` · son planlı ${onceki.ad}: ${saatYaz(onceki.bas)}–${saatYaz(onceki.bit)}` : '') + (sonraki ? ` · sıradaki ${sonraki.ad}: ${saatYaz(sonraki.bas)}` : '') });
        return;
      }
      const hak = (d.bit - d.bas) * 60;
      if (a.sure > hak + TOLERANS_DK * 60) asim.push({ ...satir, aciklama: `${d.ad} ${saatYaz(d.bas)}–${saatYaz(d.bit)} · hakkı ${d.bit - d.bas} dk, ${Math.round((a.sure - hak) / 60)} dk fazla` });
      else dogru.push({ ...satir, aciklama: `${d.ad} ${saatYaz(d.bas)}–${saatYaz(d.bit)}` });
      return;
    }
    const simdiki = dilimler.find(d => simdi >= d.bas + TOLERANS_DK && simdi < d.bit);
    if (simdiki) cikmayan.push({ ...satir, kTur: simdiki.tur, aciklama: `${simdiki.ad} ${saatYaz(simdiki.bas)}–${saatYaz(simdiki.bit)} · ${simdi - simdiki.bas} dk geçti` });
    else if (a.tur === 'diger') digerDurum.push({ ...satir, aciklama: '' });
  });
  return { ref, yokGecerli, gizlenen, mesaideYok, planSimdi, cmsSimdi, cikmayan, planDisi, asim, dogru, digerDurum, eslesmeyen, planDisiCms, cmsteYok, toplam: cms.ajanlar.length };
}

/* İsim benzerliği: Türkçe karakter, eksik/fazla soyad, kısaltma (HANDE~HANDENUR) ve tek harf hatası (SELVHAN~SELVIHAN) toleranslı */
function lev1(a, b) {
  if (a === b) return true;
  if (Math.abs(a.length - b.length) > 1) return false;
  let i = 0, j = 0, fark = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { i++; j++; continue; }
    if (++fark > 1) return false;
    if (a.length > b.length) i++; else if (b.length > a.length) j++; else { i++; j++; }
  }
  return fark + (a.length - i) + (b.length - j) <= 1;
}
const kelimeBenzer = (a, b) => a === b || (a.length >= 4 && b.length >= 4 && (a.startsWith(b) || b.startsWith(a))) || (a.length >= 5 && b.length >= 5 && lev1(a, b));
function isimBenzer(n1, n2) {
  if (n1 === n2) return true;
  const t = n1.split(' '), u = n2.split(' ');
  if (!kelimeBenzer(t[0], u[0])) return false;
  const tSon = t.slice(1), uSon = u.slice(1);
  if (!tSon.length || !uSon.length) return false;
  return tSon.some(x => uSon.some(y => kelimeBenzer(x, y)));
}
/* ---------- GÜNLÜK YOKLAMA ----------
   Yoklama Excel'i (her gün bir sayfa, altta AgentName | AgentId | Görevi | Vardiya | Login | Açıklama tablosu).
   Sadece bu tarayıcıda, sadece o gün için tutulur; ortak Sheet'e gönderilmez. */

    ST.planDisi = (ST.planDisi || []).filter(d => d.cms !== no);
    ST.planDisi.push({ ad, cms: no, not });
    kaydet(`${ad} plan dışı olarak işaretlendi${not ? ' (' + not + ')' : ''}`);
    kontrolCiz(); return;
  }
  if (i === 'yeni') {
    const ad = (prompt('Plana eklenecek ad soyad (Türkçe karakterleri düzeltebilirsin):', guzelAd(cmsAd || '')) || '').trim();
    if (!ad) { kontrolCiz(); return; }

    if (!(g >= 1 && g <= N)) { toast('Geçersiz grup'); kontrolCiz(); return; }
    ST.kisiler.forEach(x => { if (String(x.cms) === no) delete x.cms; });
    ST.kisiler.push({ ad, g: grupTemel(g, haftaFark(ref, isoTarih(ST.temelHafta)), N), cms: no });

$('kopyalaBtn').onclick = async () => {
  if (!ST) return;
  const p = haftaPlani(ST, goruntu), html = mailHtml(p, goruntu, ST, '');
  const duz = `${metin(ST, 'anaBaslik')} - ${haftaAralik(goruntu)}\n\n` + p.bol.map(b => `${b.no}. GRUP (${b.saat.join(' | ')})\n` + b.kisiler.join('\n')).join('\n\n');
  try {
    if (navigator.clipboard && window.ClipboardItem) {
      await navigator.clipboard.write([new ClipboardItem({ 'text/html': new Blob([html], { type: 'text/html' }), 'text/plain': new Blob([duz], { type: 'text/plain' }) })]);
      toast('Kopyalandı. Outlook\'ta yeni maile Ctrl+V ile yapıştır.'); return;
    }
  } catch (e) {}
  const d = document.createElement('div');
  d.contentEditable = 'true'; d.style.cssText = 'position:fixed;left:-99999px;top:0';
  d.innerHTML = html; document.body.appendChild(d);
  const r = document.createRange(); r.selectNodeContents(d);
  const s = getSelection(); s.removeAllRanges(); s.addRange(r);
  const ok = document.execCommand('copy'); s.removeAllRanges(); d.remove();
  toast(ok ? 'Kopyalandı. Outlook\'ta yeni maile Ctrl+V ile yapıştır.' : 'Kopyalanamadı. Sayfayı seçip elle kopyala.');
};
