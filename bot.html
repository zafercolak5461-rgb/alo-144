<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Paribu Bot</title>
<script>
  // ↓↓↓ Sadece bu satırı değiştir: Apps Script'teki web uygulaması bağlantısı (…/exec ile biter)
  const ADRES = 'BURAYA_EXEC_BAGLANTISI';
  // ↑↑↑
  if (/^https:\/\/script\.google\.com\/.+\/exec$/.test(ADRES)) location.replace(ADRES);
</script>
<style>
  :root { --bg: #f4f5f1; --kart: #fff; --yazi: #1d211b; --soluk: #6b7166; }
  @media (prefers-color-scheme: dark) { :root { --bg: #121410; --kart: #1c1f19; --yazi: #e8ebe3; --soluk: #9aa093; } }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--bg); color: var(--yazi);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .kart { background: var(--kart); border-radius: 14px; padding: 24px 28px; text-align: center; max-width: 320px; }
  a { display: inline-block; margin-top: 12px; background: var(--yazi); color: var(--bg); padding: 10px 18px; border-radius: 10px; text-decoration: none; font-weight: 600; }
  .alt { color: var(--soluk); font-size: 13px; }
</style>
</head>
<body>
  <div class="kart">
    <b>Paribu Bot</b>
    <div class="alt" id="durum">Panel açılıyor…</div>
    <a id="git" href="#">Paneli aç</a>
  </div>
<script>
  const gecerli = /^https:\/\/script\.google\.com\/.+\/exec$/.test(ADRES);
  document.getElementById('git').href = gecerli ? ADRES : '#';
  if (!gecerli) document.getElementById('durum').textContent = 'Bağlantı henüz girilmemiş (index.html içindeki ADRES satırı).';
</script>
</body>
</html>
