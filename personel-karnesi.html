<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ALO 144 Personel Karnesi</title>
  
  <!-- CSS & Kütüphaneler -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/exceljs/dist/exceljs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <style>
    .sidebar-hidden { display: none !important; }
    .btn-disabled { opacity: 0.5; pointer-events: none; cursor: not-allowed; }
  </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans antialiased">

  <div id="app" class="flex h-screen overflow-hidden">
    
    <!-- SOL MENÜ (SIDEBAR) -->
    <aside id="sidebar" class="w-64 bg-slate-900 text-white flex flex-col flex-shrink-0 transition-all duration-300">
      <div class="p-4 text-xl font-bold border-b border-slate-800 flex items-center justify-between">
        <span>ALO 144 Karne</span>
        <span id="userBadge" class="text-xs bg-blue-600 px-2 py-1 rounded text-white">Giriş Yapılmadı</span>
      </div>
      
      <nav id="navContainer" class="flex-1 p-4 space-y-1 overflow-y-auto">
        <!-- Dinamik Menü Elemanları Buraya Eklenecek -->
      </nav>

      <div class="p-4 border-t border-slate-800 text-xs text-slate-400">
        <div id="userInfo" class="truncate font-medium text-slate-200"></div>
        <button id="logoutBtn" onclick="logout()" class="mt-2 w-full bg-red-600 hover:bg-red-700 text-white py-1 px-2 rounded text-xs transition">
          Çıkış Yap
        </button>
      </div>
    </aside>

    <!-- ANA İÇERİK ALANI -->
    <main class="flex-1 flex flex-col overflow-y-auto bg-gray-50">
      
      <!-- Üst Bar / Header -->
      <header class="bg-white border-b border-gray-200 px-6 py-4 flex items-center justify-between shadow-sm">
        <h1 id="pageTitle" class="text-2xl font-bold text-gray-800">Personel Karnesi Dashboard</h1>
        
        <div id="actionButtons" class="flex items-center space-x-2">
          <!-- Yetkiye göre gösterilip gizlenecek işlem butonları -->
          <button id="btnUpdate" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition flex items-center">
            <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d=" "></path></svg>
            Veri Güncelle
          </button>
          <button id="btnSunum" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition">
            PPTX İndir
          </button>
          <button id="btnExcel" class="bg-emerald-800 hover:bg-emerald-900 text-white px-4 py-2 rounded-lg text-sm font-medium transition">
            Excel İndir
          </button>
        </div>
      </header>

      <!-- Sayfa İçeriği -->
      <section id="contentArea" class="p-6 flex-1">
        <div id="loginPrompt" class="bg-white p-8 rounded-xl shadow-md max-w-md mx-auto text-center mt-12">
          <h2 class="text-xl font-bold mb-4">Sisteme Giriş Yapın</h2>
          <p class="text-gray-600 mb-6 text-sm">ALO 144 Personel Karnesi sistemine erişmek için Google hesabınızla oturum açın.</p>
          <div id="g_id_onload"
               data-client_id="YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com"
               data-callback="handleCredentialResponse">
          </div>
          <div class="g_id_signin flex justify-center" data-type="standard"></div>
        </div>

        <div id="dashboardContent" class="hidden">
          <!-- Metrik Kartları ve Grafik Alanları -->
          <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
            <div class="bg-white p-5 rounded-xl border border-gray-200 shadow-sm">
              <span class="text-gray-500 text-sm font-medium">Toplam Personel</span>
              <div id="statTotalPersonnel" class="text-3xl font-extrabold text-gray-900 mt-2">0</div>
            </div>
            <div class="bg-white p-5 rounded-xl border border-gray-200 shadow-sm">
              <span class="text-gray-500 text-sm font-medium">Ortalama Karne Skoru</span>
              <div id="statAvgScore" class="text-3xl font-extrabold text-blue-600 mt-2">%0</div>
            </div>
            <div class="bg-white p-5 rounded-xl border border-gray-200 shadow-sm">
              <span class="text-gray-500 text-sm font-medium">Hedefe Ulaşım Oranı</span>
              <div id="statTargetRatio" class="text-3xl font-extrabold text-emerald-600 mt-2">%0</div>
            </div>
          </div>

          <div class="bg-white p-6 rounded-xl border border-gray-200 shadow-sm">
            <h3 class="text-lg font-bold mb-4 text-gray-800">Aylık Performans Grafiği</h3>
            <canvas id="mainChart" height="100"></canvas>
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- UYGULAMA MANTIĞI & YETKİLENDİRME (RBAC) -->
  <script>
    // Config & Sheet Bilgileri
    const CONFIG = {
      SHEET_ID: 'YOUR_SHEET_ID',
      KARNE_SHEET_ID: 'YOUR_KARNE_SHEET_ID',
      AUTH_SHEET_ID: 'YOUR_AUTH_SHEET_ID',
      API_KEY: 'YOUR_GOOGLE_API_KEY'
    };

    // Tüm Menü Yapısı Tanımı
    const ALL_NAV_ITEMS = [
      { id: 'dashboard', name: 'Genel Bakış', icon: '📊', permKey: null }, // Herkese Açık
      { id: 'personel', name: 'Personel Bilgileri', icon: '👤', permKey: 'canPersonel' },
      { id: 'genel', name: 'Genel Değerlendirme', icon: '📈', permKey: 'canGenel' },
      { id: 'analiz', name: 'Performans Analizi', icon: '🔍', permKey: 'canAnaliz' },
      { id: 'yonetici', name: 'Yönetici Detayı', icon: '👔', permKey: 'canYonetici' },
      { id: 'parametre', name: 'Parametreler', icon: '⚙️', permKey: 'canParametre' },
      { id: 'excelBicim', name: 'Excel Biçimlendirme', icon: '🎨', permKey: 'canExcelBicim' }
    ];

    let currentUser = null;
    let currentUserPermissions = null;

    // Google Sign-In Callback
    function handleCredentialResponse(response) {
      const responsePayload = parseJwt(response.credential);
      currentUser = {
        email: responsePayload.email.trim().toLowerCase(),
        name: responsePayload.name,
        picture: responsePayload.picture
      };

      document.getElementById('userInfo').innerText = currentUser.email;
      document.getElementById('loginPrompt').classList.add('hidden');
      document.getElementById('dashboardContent').classList.remove('hidden');

      // Yetkileri Yükle ve Kontrol Et
      fetchPermissionsAndInit(currentUser.email);
    }

    function parseJwt(token) {
      const base64Url = token.split('.')[1];
      const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
      const jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
        return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
      }).join(''));
      return JSON.parse(jsonPayload);
    }

    // Sheet Değerini Boolean Tipe Dönüştürücü (DÜZELTME)
    function parseBool(val) {
      if (typeof val === 'boolean') return val;
      if (!val) return false;
      return String(val).trim().toUpperCase() === 'TRUE';
    }

    // Google Sheets API üzerinden AUTH_SHEET_ID Okuma
    async function fetchPermissionsAndInit(userEmail) {
      try {
        const url = `https://sheets.googleapis.com/v4/spreadsheets/${CONFIG.AUTH_SHEET_ID}/values/A1:L100?key=${CONFIG.API_KEY}`;
        const res = await fetch(url);
        const data = await res.json();
        
        if (!data.values) {
          console.error("Yetki tablosu bulunamadı veya yetkisiz erişim.");
          applyPermissions(getEmptyPermissions());
          return;
        }

        const rows = data.values;
        // E-Posta Satırını Bul (B Sütunundaki e-postalar)
        const userRow = rows.find(r => r[1] && r[1].trim().toLowerCase() === userEmail);

        if (userRow) {
          // Tablo Sütunları A: İsim, B: Gmail, C: Süper Yetkili ... L: Excel Biçimlendirme
          currentUserPermissions = {
            isSuper: parseBool(userRow[2]),       // C
            canUpdate: parseBool(userRow[3]),     // D Sütunu (Güncelleme - Sadece işlem yetkisi)
            canSunum: parseBool(userRow[4]),      // E
            canExcel: parseBool(userRow[5]),      // F
            canAnaliz: parseBool(userRow[6]),     // G
            canPersonel: parseBool(userRow[7]),   // H
            canGenel: parseBool(userRow[8]),      // I
            canParametre: parseBool(userRow[9]),  // J
            canYonetici: parseBool(userRow[10]),  // K
            canExcelBicim: parseBool(userRow[11]) // L
          };
        } else {
          currentUserPermissions = getEmptyPermissions();
        }

        applyPermissions(currentUserPermissions);

      } catch (err) {
        console.error("Yetkiler okunurken hata oluştu:", err);
        applyPermissions(getEmptyPermissions());
      }
    }

    function getEmptyPermissions() {
      return {
        isSuper: false, canUpdate: false, canSunum: false, canExcel: false,
        canAnaliz: false, canPersonel: false, canGenel: false,
        canParametre: false, canYonetici: false, canExcelBicim: false
      };
    }

    // YETKİLERİ ARAYÜZE UYGULAMA (DÜZELTİLEN KRİTİK MANTIK)
    function applyPermissions(perms) {
      // 1. Sol Menü Elemanlarını Oluştur
      const navContainer = document.getElementById('navContainer');
      navContainer.innerHTML = '';

      ALL_NAV_ITEMS.forEach(item => {
        // Süper yetkili her menüyü görür; değilse permKey şartına bakılır
        const hasAccess = perms.isSuper || !item.permKey || perms[item.permKey] === true;

        if (hasAccess) {
          const a = document.createElement('a');
          a.href = "#";
          a.className = "flex items-center space-x-3 px-3 py-2.5 rounded-lg text-sm text-slate-300 hover:bg-slate-800 hover:text-white transition";
          a.innerHTML = `<span>${item.icon}</span><span>${item.name}</span>`;
          a.onclick = () => navigateTo(item.id);
          navContainer.appendChild(a);
        }
      });

      // 2. İşlem Butonlarının Görünürlüğünü Ayarla (Güncelleme / Excel / PPTX)
      // "canUpdate" FALSE olsa bile menü KAPANMAZ, sadece aşağıdaki buton kısıtlanır:
      toggleButton('btnUpdate', perms.isSuper || perms.canUpdate);
      toggleButton('btnSunum', perms.isSuper || perms.canSunum);
      toggleButton('btnExcel', perms.isSuper || perms.canExcel);

      // 3. Rol Rozetini Güncelle
      const badge = document.getElementById('userBadge');
      if (perms.isSuper) badge.innerText = "Süper Admin";
      else if (perms.canUpdate) badge.innerText = "Yönetici";
      else badge.innerText = "Görüntüleyen";
    }

    function toggleButton(btnId, isVisible) {
      const btn = document.getElementById(btnId);
      if (!btn) return;
      if (isVisible) {
        btn.classList.remove('hidden', 'btn-disabled');
      } else {
        btn.classList.add('hidden'); // Yetkisi yoksa butonu gizler
      }
    }

    function navigateTo(pageId) {
      document.getElementById('pageTitle').innerText = ALL_NAV_ITEMS.find(i => i.id === pageId)?.name || 'Dashboard';
      // Sayfa yükleme logic'i buraya gelir
    }

    function logout() {
      location.reload();
    }
  </script>
</body>
</html>
